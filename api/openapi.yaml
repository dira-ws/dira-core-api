openapi: 3.1.0
info:
  title: Dira Core API
  version: 0.1.0
  description: >-
    Socle de la plateforme Dira : identité, portefeuilles, paiements,
    notifications, véhicules et notes. Les verticales `dira-food-api`
    (livraison) et `dira-vtc-api` (courses) se posent dessus.


    ⚠️ Derrière la passerelle, ces routes sont servies à la RACINE
    (`/api/v1/...`), sans préfixe de verticale : l'authentification et le
    portefeuille sont les mêmes pour les deux, et les préfixer obligerait une
    application à choisir une verticale juste pour se connecter.


    ⚠️ Les routes `/internal/...` NE FIGURENT PAS ici. Elles portent les
    pouvoirs d'un service — débiter un portefeuille, ouvrir un compte — sont
    gardées par un secret partagé, et ne sont appelées par aucune application.
    Leur liste vit dans `internal/serviceapi/`, et un test refuse toute route
    qui s'y ajouterait sans être déclarée.


    **Erreurs.** Une seule enveloppe : `{"error":{"code","message"}}`, le
    message dans la langue de `Accept-Language`. Un `validation_failed`
    (422) ajoute `fields` — les clés JSON en cause — et, quand la valeur
    d'un champ n'est pas en cause, `reason` : `unknown_field` (une clé que
    la route ne connaît pas : elle est REFUSÉE, pas ignorée, pour qu'une
    application ne croie pas avoir enregistré ce qui a été jeté) ou
    `invalid_json`.


    **Téléphones.** Toujours en E.164 avec le `+` et l'indicatif ; les
    séparateurs (espaces, points, tirets) sont tolérés et retirés. Le
    numéro est l'identifiant du compte : « 22899000001 » sans `+` est
    refusé (`fields: ["phone"]`), il ne devine pas un pays.


    **Pays.** Toute donnée est bornée par PAYS (ISO 3166-1 alpha-2). Une
    application envoie le sien dans l'en-tête `X-Dira-Country` ; le serveur
    répond avec le pays RETENU dans le même en-tête. Pour un compte
    ordinaire, le pays du compte (dans le jeton, `cty`) s'impose ; seul un
    compte de direction (`cty_any`) change de pays par l'en-tête. Sans
    jeton — inscription, connexion —, l'en-tête est admis s'il nomme un
    pays ouvert (`GET /countries`), sinon le pays par défaut du
    déploiement. Une application trouve son pays par
    `POST /me/country/resolve`.
servers:
  - url: /api/v1
tags:
  - name: countries
    description: La couche pays — où Dira est ouvert, dans quel pays je suis
  - name: map-markers
    description: Les marqueurs de carte hors véhicules — livreur, client, marchand, arrêt — et leurs images
  - name: auth
    description: Inscription, connexion, rotation de jeton
  - name: users
    description: Profil, préférences, carnet d'adresses
  - name: wallet
    description: Portefeuille de jetons et solde Dira
  - name: payments
    description: Mobile money — initiation, statut, rappels du prestataire
  - name: notifications
    description: Boîte de réception, appareils, gabarits multilingues
  - name: ratings
    description: Avis déposés par les verticales, lus par tout le monde
  - name: admin
    description: Administration des comptes — commune aux deux verticales
  - name: uploads
    description: Envoi de fichiers — une porte pour toute la plateforme
  - name: finance
    description: |
      LA COMPTABILITÉ. La FACTURATION par pays et par métier (des jetons à
      l'acceptation ou une commission en pourcentage ; à quelle étape le
      client est débité), le JOURNAL en partie double que chaque mouvement de
      portefeuille écrit dans la même transaction, l'APERÇU (balance des
      comptes, produits, dettes) et l'INTÉGRITÉ : un balayage recalcule
      chaque solde depuis ses mouvements, vérifie le journal, et alerte le
      staff (`staff_finance_alert`) — un solde modifié sans mouvement se voit.
paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Create an account
      description: >-
        `role` ∈ client | driver | merchant (défaut client ; `admin` refusé,
        422). `first_name` / `last_name` sont facultatifs — `name` reste le
        nom d'affichage. Un livreur reçoit son portefeuille de jetons, un
        client son Dira Cash.


        **Pays du compte** : l'en-tête `X-Dira-Country` s'il nomme un pays
        ouvert (l'application a résolu sa position avant de s'inscrire),
        sinon l'INDICATIF du téléphone (`+229` → BJ), sinon le pays par
        défaut. La réponse le porte dans `user.country` et dans l'en-tête.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, name, password]
              properties:
                phone: {type: string, description: E.164 avec le +}
                name: {type: string, maxLength: 120}
                password: {type: string, minLength: 8, maxLength: 128}
                role: {type: string, enum: [client, driver, merchant]}
                email: {type: string, format: email}
                first_name: {type: string, maxLength: 80}
                last_name: {type: string, maxLength: 80}
                app:
                  type: string
                  enum: [client, driver, courier, merchant, console]
                  description: >-
                    L'application qui inscrit. ⚠️ **Pour un `role: driver`,
                    elle décide du MÉTIER du compte** : `driver` en fait un
                    chauffeur de courses, `courier` un livreur, et ce compte
                    n'entrera plus jamais dans l'autre application (403
                    `wrong_app`).


                    ⚠️ **Ici, « le premier qui déclare » est légitime, et c'est
                    le seul endroit où ça l'est** : un compte qui vient d'être
                    créé n'a aucun profil, donc aucune réalité à contredire.
                    L'application qui l'inscrit EST son métier.


                    Omise = aucun métier posé ; la première verticale qui
                    garantira le profil le réclamera.
                device_id: {type: string, maxLength: 128}
                device_name: {type: string, maxLength: 120}
                platform:
                  type: string
                  enum: [web, android, ios]
                  description: >-
                    Sur QUOI l'application tourne. ⚠️ Elle ne sert qu'au **fond
                    de carte**, et elle est indispensable pour ça : une clé
                    Google se restreint par ce qui l'utilise (empreinte SHA-1 +
                    nom de paquet sur Android, identifiant de bundle sur iOS,
                    référent HTTP sur le web), donc chaque plateforme a la
                    SIENNE. Servir la clé du web à une application Android
                    donnerait une carte grise et une facture pour rien.


                    Omise = aucune clé servie, donc fond Dira. Repli silencieux
                    et correct : une application pas encore mise à jour garde
                    une carte qui marche.
      responses:
        "201": {description: Account created with a token pair}
        "409": {description: phone_taken}
        "422": {description: "validation_failed — `fields` names the keys"}
  /auth/login:
    post:
      tags: [auth]
      summary: Sign in
      description: >-
        **`app` dit QUELLE APPLICATION demande la connexion**, et le socle
        refuse un compte qui n'y a rien à faire : un client ne se connecte pas
        dans l'application chauffeur, ni l'inverse. ⚠️ Sans ce champ, le mot de
        passe suffisait : le jeton était émis, puis chaque écran répondait 403
        et la personne croyait l'application cassée au lieu de comprendre
        qu'elle s'était trompée d'application.


        Correspondance : `client` → compte client, `driver` → **chauffeur des
        courses**, `courier` → **livreur**, `merchant` → marchand, `console` →
        direction.


        ⚠️ **`courier` EST NOUVEAU, ET LES DEUX APPLICATIONS D'AGENT DOIVENT
        ENFIN SE DISTINGUER.** Elles envoyaient toutes les deux `driver`, et
        tant qu'elles le faisaient le socle ne pouvait pas les séparer : un
        chauffeur qui ouvrait la livraison recevait un jeton parfaitement
        valide, se faisait poser un profil de livreur au passage — un compte,
        deux métiers, ce que la plateforme n'admet pas — et **chassait sa
        propre session de courses de son propre téléphone**, puisque le
        registre d'appareils est clé par compte et que deux applications sur
        un même téléphone sont deux installations. Les deux applications se
        déconnectaient l'une l'autre, en boucle, en nommant SON téléphone.


        Un compte d'agent appartient donc à UNE application, `driver` ou
        `courier` — `courier` a le rôle `driver` au socle, la frontière
        nouvelle est le métier, pas le rôle. L'appartenance est posée à
        l'inscription, ou réclamée par la verticale au moment où elle garantit
        le profil ; **tant qu'elle est absente, rien n'est refusé** (les
        applications déjà publiées continuent de fonctionner).


        **Deux portes restent ouvertes, volontairement.** Un `app` ABSENT ne
        vérifie rien : une application pas encore mise à jour continue de
        fonctionner telle quelle. Et un compte de DIRECTION entre partout —
        l'exploitation doit pouvoir ouvrir l'application d'un chauffeur pour
        reproduire ce qu'il décrit.


        Le refus `403 wrong_app` DIT OÙ ALLER : **`error.reason`** nomme
        l'application à ouvrir. ⚠️ `reason`, et rien d'autre — l'enveloppe
        d'erreur ne rend que `code`, `message`, `fields` et `reason` ; il n'y a
        pas de `meta` sur le fil. L'application affiche « Ce compte est un
        compte client, ouvrez l'application Dira » plutôt qu'un échec nu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone: {type: string, description: E.164 avec le +}
                password: {type: string}
                app:
                  type: string
                  enum: [client, driver, courier, merchant, console]
                  description: >-
                    L'application qui demande. `driver` = les COURSES,
                    `courier` = la LIVRAISON. Omis = aucune vérification
                    (compatibilité).
                device_id:
                  type: string
                  maxLength: 128
                  description: >-
                    **L'IDENTIFIANT D'INSTALLATION de l'application.** Un
                    chauffeur ou un livreur ne tient qu'**UNE** session : cette
                    connexion-ci chasse la précédente, dont les jetons de
                    rafraîchissement sont jetés et dont le jeton d'accès cesse
                    d'être accepté — y compris par le suivi, qui ferme son
                    socket de positions.


                    ⚠️ Le serveur ne peut pas le deviner : ni l'adresse IP (un
                    chauffeur en change dix fois par jour), ni le modèle du
                    téléphone (toute une ville roule sur le même), ni le jeton
                    de notification (il change à chaque réinstallation du
                    service Google) ne désignent une installation.


                    ⚠️ Il doit vivre **aussi longtemps que le jeton de
                    rafraîchissement, à côté de lui**. Tiré à chaque lancement,
                    ou rangé dans un cache que le système nettoie, l'application
                    se chasse **elle-même** à chaque ouverture.


                    Omis = aucune règle d'appareil, le comportement d'avant :
                    une application pas encore mise à jour fonctionne telle
                    quelle. N'a aucun effet pour un client, un marchand ou la
                    direction — eux ont le droit d'être sur plusieurs appareils.
                device_name:
                  type: string
                  maxLength: 120
                  description: >-
                    Le libellé LISIBLE de l'appareil — « Tecno Spark 10 ·
                    Android 13 ». Il sert à ce que l'écran de l'appareil chassé
                    puisse dire « vous vous êtes connecté sur Tecno Spark 10 »
                    au lieu d'« erreur de connexion ». Tronqué, jamais refusé.
                platform:
                  type: string
                  enum: [web, android, ios]
                  description: >-
                    Sur QUOI l'application tourne. ⚠️ Elle ne sert qu'au **fond
                    de carte**, et elle est indispensable pour ça : une clé
                    Google se restreint par ce qui l'utilise (empreinte SHA-1 +
                    nom de paquet sur Android, identifiant de bundle sur iOS,
                    référent HTTP sur le web), donc chaque plateforme a la
                    SIENNE. Servir la clé du web à une application Android
                    donnerait une carte grise et une facture pour rien.


                    Omise = aucune clé servie, donc fond Dira. Repli silencieux
                    et correct : une application pas encore mise à jour garde
                    une carte qui marche.
      responses:
        "200":
          description: >-
            Token pair. Pour un chauffeur ou un livreur qui a déclaré son
            appareil, la réponse porte en plus **`session`** :
            `{device_id, device_name, single_device, superseded_device_id,
            superseded_device_name}`. Les deux derniers ne sont présents que si
            cette connexion vient de **chasser** un autre appareil — c'est la
            seule occasion de prévenir quelqu'un dont le compte servait
            ailleurs, l'appareil chassé étant peut-être éteint.


            Et **`maps`** : `{basemap}` — `dira` ou `google`, le fond à montrer
            d'ABORD dans ce pays. Servi aussi au rafraîchissement, pour qu'un
            changement atteigne une application restée ouverte.


            ⚠️ **AUCUNE CLÉ N'Y VOYAGE (v4.40.0).** Le serveur en a servi une,
            par pays et par plateforme, du 22 au 29 septembre 2026. Chaque
            application porte DÉJÀ la sienne, restreinte à son empreinte, à son
            bundle ou à son référent — c'est cette restriction qui protège une
            clé, et elle appartient à la plateforme, pas au pays. Le serveur ne
            tranche donc que le DÉFAUT ; le choix de la personne l'emporte
            ensuite, et il vit chez elle.
        "401":
          description: >-
            `invalid_credentials`.
        "403":
          description: >-
            `wrong_app` — le compte existe, le mot de passe est bon, mais il
            n'appartient pas à cette application ; `error.reason` nomme
            la bonne (`client` · `driver` · `courier` · `merchant` ·
            `console`). Ou `account_suspended`.


            ⚠️ **L'écran doit dire OÙ ALLER, jamais « erreur de connexion ».**
            Pour un compte d'agent : « Ce compte est un compte livreur ; ouvrez
            l'application Dira Livreur. » Le mot de passe était juste — envoyer
            la personne en changer un qui fonctionne ne mène nulle part, et
            c'est un appel au support pour rien.
  /auth/otp:
    post:
      tags: [auth]
      summary: Ask for a one-time code (clients)
      description: >-
        **S'inscrire et se connecter avec son téléphone, sans mot de passe.**
        Le socle envoie six chiffres par WhatsApp ou par SMS ; `POST
        /auth/otp/verify` les consomme, inscrit le compte s'il n'existait pas
        et ouvre la session.


        ⚠️ **LA PASSERELLE N'EST PAS ENCORE CÂBLÉE.** Tant que `OTP_SENDER`
        vaut `echo` — c'est le défaut —, **rien n'est remis** : la réponse
        porte `channel: "echo"` et **`dev_code`, le code EN CLAIR**. C'est ce
        qui permet de câbler les applications dès maintenant, et c'est une
        faille assumée et temporaire : quiconque connaît un numéro entre dans
        le compte. `dev_code` **disparaîtra sans préavis** le jour où un canal
        réel est branché — une application qui le lit doit le traiter comme un
        bonus de développement, jamais comme un dû, et toujours offrir la
        saisie manuelle.


        ⚠️ **RÉSERVÉ AUX CLIENTS, et c'est une règle de sécurité.** Six
        chiffres remplacent un mot de passe : l'ouvrir aux chauffeurs, aux
        marchands ou à la direction ferait du numéro de téléphone — qui
        s'affiche sur une plaque et se donne à un passager — le seul secret
        protégeant un compte qui débite des portefeuilles. Un compte qui n'est
        pas `client` ne reçoit **aucun** code (`403 otp_not_available`), et une
        application d'agent se voit refuser la porte.


        ⚠️ **ELLE NE DIT JAMAIS SI LE NUMÉRO EST CONNU.** Rendre « compte
        existant » ferait de cette route un annuaire : qui veut savoir si
        quelqu'un est client de Dira n'aurait qu'à poster son numéro. C'est
        `created` dans la réponse de la vérification qui dit à l'application de
        demander le nom, une fois la personne authentifiée.


        **Cadence** : un code par minute et par numéro (`429 otp_too_soon`),
        cinq par heure (`429 otp_too_many_requests`). Le code vit **5 minutes**
        et meurt après **5 essais**. Une nouvelle demande REMPLACE le code
        précédent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: {type: string, description: E.164 avec le +}
                channel:
                  type: string
                  enum: [whatsapp, sms]
                  description: >-
                    Le canal souhaité, `whatsapp` par défaut — il coûte moins
                    cher qu'un SMS et c'est déjà celui par lequel la livraison
                    parle aux clients. Le serveur rend le canal qui a
                    RÉELLEMENT servi : un fournisseur peut basculer.
                app:
                  type: string
                  enum: [client, driver, courier, merchant, console]
                  description: >-
                    Seul `client` ouvre cette porte (les deux applications de
                    clients partagent ce mot). Omis = toléré, comme ailleurs,
                    pour une application pas encore à jour ; le rôle du compte
                    est de toute façon vérifié à la vérification.
                locale: {type: string, enum: [fr, en]}
      responses:
        "200":
          description: >-
            `{sent, channel, expires_at, resend_after}` — et `dev_code` tant
            que `channel` vaut `echo`.


            ⚠️ **Le compte à rebours de l'écran se rend depuis `expires_at`**,
            jamais depuis l'horloge du téléphone, et le bouton « renvoyer » se
            rouvre après `resend_after` secondes.
        "403":
          description: >-
            `otp_not_available` — ce compte se connecte avec un mot de passe
            (chauffeur, livreur, marchand, direction), ou l'application n'est
            pas une application de client. Aucun code n'a été envoyé.
        "422":
          description: >-
            `validation_failed` — `fields: ["phone"]` si le `+` manque : le
            socle ne devine pas d'indicatif.
        "429":
          description: >-
            `otp_too_soon` (un code vient de partir) ou
            `otp_too_many_requests` (plafond horaire de ce numéro).
        "503":
          description: >-
            `otp_delivery_failed` — la passerelle n'a pas pris le message.
            **Rien n'est écrit** : ni la cadence ni le plafond ne sont
            consommés, redemander tout de suite est légitime.
  /auth/otp/verify:
    post:
      tags: [auth]
      summary: Verify a one-time code — signs up or signs in (clients)
      description: >-
        Consomme le code : **inscrit** le compte s'il n'existait pas
        (`201`, `created: true`), **connecte** sinon (`200`). La réponse est
        celle de `POST /auth/login`, augmentée de `created`.


        ⚠️ **LE CODE EST CONSOMMÉ AVANT TOUTE AUTRE VÉRIFICATION** — compte
        suspendu, mauvaise application. Un code qui survivrait à un refus
        resterait valide pour être rejoué ailleurs.


        ⚠️ **LE NOM EST FACULTATIF.** Sans lui, le numéro fait office de nom
        d'affichage, et la personne le changera depuis son profil (`PATCH /me`)
        — c'est la convention déjà en vigueur : « nom égal au téléphone » se lit
        « nom non posé ». Exiger un nom ajouterait un écran entre le code et la
        première course. L'application qui veut le demander le fait **après**
        la vérification, quand `created` vaut `true`.


        ⚠️ **LE COMPTE NÉ ICI N'A PAS DE MOT DE PASSE**, et `POST /auth/login`
        lui répond `401 invalid_credentials` — jamais un code qui dirait « ce
        compte se connecte autrement », ce qui révélerait quels numéros
        existent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: {type: string, description: E.164 avec le +}
                code: {type: string, minLength: 4, maxLength: 12}
                name:
                  type: string
                  maxLength: 120
                  description: >-
                    Facultatif, et lu **seulement si le compte naît ici**.
                first_name: {type: string, maxLength: 80}
                last_name: {type: string, maxLength: 80}
                app:
                  type: string
                  enum: [client, driver, courier, merchant, console]
                device_id: {type: string, maxLength: 128}
                device_name: {type: string, maxLength: 120}
                platform:
                  type: string
                  enum: [web, android, ios]
                  description: Acceptée et ignorée, comme à l'inscription.
      responses:
        "200":
          description: Connexion — même corps que `POST /auth/login`.
        "201":
          description: >-
            Inscription — même corps, plus **`created: true`**. C'est le signal
            qui autorise l'écran « comment vous appelez-vous ? ».
        "401":
          description: >-
            `otp_invalid` (code faux, ou aucun code en cours — les deux
            répondent pareil, sans quoi on saurait quels numéros sont en train
            de se connecter), `otp_expired` (le code a plus de 5 minutes) ou
            `otp_too_many_attempts` (cinq essais : le code est **mort**, il
            faut en redemander un).
        "403":
          description: >-
            `otp_not_available` (ce compte se connecte avec un mot de passe),
            `account_suspended`, ou `wrong_app`.
  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh token
      description: >-
        **Durées de vie.** L'access token vit `JWT_ACCESS_TTL` (défaut
        **15 min** ; staging **10 min** pour rendre l'expiration testable),
        le refresh token `JWT_REFRESH_TTL` (défaut **30 jours**). Le refresh
        est **consommé** : le rejouer répond 401 — deux requêtes concurrentes
        avec le même en invalident une. ⚠️ L'access token, lui, reste
        **valide jusqu'à son échéance** même après une rotation : une
        connexion WebSocket ouverte avec l'ancien jeton n'est pas coupée par
        le rafraîchissement — c'est le suivi qui la ferme, à l'échéance,
        avec le code 4401 `token_expired`, et le client revient avec le
        nouveau. Un court chevauchement est donc normal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: {type: string}
                platform:
                  type: string
                  enum: [web, android, ios]
                  description: >-
                    Pour recevoir le **fond de carte à jour**. ⚠️ Sans elle, une
                    clé révoquée vit aussi longtemps que la session : un
                    chauffeur reste connecté trente jours, et la changer dans la
                    console ne l'atteindrait qu'un mois plus tard — c'est-à-dire
                    que la rotation, seule raison de servir la clé depuis le
                    serveur, ne servirait à rien. Renvoyée ici, la dérive se
                    borne à la durée d'un jeton d'accès.
      responses:
        "200":
          description: >-
            New token pair, plus **`maps`** quand `platform` a été envoyée —
            même forme qu'à la connexion. C'est ici que la rotation d'une clé
            atteint une application connectée depuis des semaines.
        "401":
          description: >-
            `invalid_token` — consommé, expiré ou révoqué : se reconnecter.


            **`session_superseded`** — ce jeton appartient à un appareil qui
            n'est plus celui du compte : un autre téléphone s'est connecté
            depuis. ⚠️ **NE PAS ENCHAÎNER UNE RECONNEXION AUTOMATIQUE** : elle
            chasserait à son tour l'autre appareil, et les deux se renverraient
            la balle indéfiniment. L'application doit **garder sa file hors
            ligne**, se déconnecter, et afficher « vous avez été déconnecté
            parce que vous vous êtes connecté sur <appareil> » —
            `error.reason` porte le libellé de l'appareil qui a pris la place.
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the refresh token
      responses:
        "204": {description: Signed out}
  /me:
    get:
      tags: [users]
      summary: Own profile
      description: >-
        Porte `country` (le pays du compte) et, pour un compte de direction
        seulement, `country_any: true` — ce compte peut regarder un autre
        pays par l'en-tête `X-Dira-Country`.
      responses:
        "200": {description: Profile}
    patch:
      tags: [users]
      summary: Update own profile
      responses:
        "200": {description: Profile}
    delete:
      tags: [users]
      summary: "Supprimer son compte (v4.47.0)"
      description: >-
        RGPD, en DEUX TEMPS. Le compte est FERMÉ immédiatement — sessions
        coupées sur tous les appareils, notifications arrêtées, connexion
        refusée ensuite (403 `account_closed`, par mot de passe comme par
        code) — et son IDENTITÉ part à l'échéance du délai de grâce, rendu dans
        `erase_at` : le nom devient « Compte supprimé », le téléphone est
        brouillé puis LIBÉRÉ (on peut se réinscrire avec le même numéro),
        l'e-mail, la photo, l'état civil, les préférences et le carnet
        d'adresses s'en vont, la boîte de notifications est purgée, et les
        verticales sont prévenues pour jeter ce qu'elles seules détiennent
        (messages de conversation, fils de support, pièces de conformité).


        ⚠️ LES COURSES ET LES COMMANDES PASSÉES RESTENT, et c'est volontaire :
        ce sont des écritures COMPTABLES — prix, commission, date. Les effacer
        trouerait le journal en partie double et retirerait d'une facturation
        déjà déclarée des montants réels. Elles ne désignent plus personne :
        aucune verticale ne stocke de nom ni de téléphone, donc anonymiser le
        compte anonymise tout l'historique, partout, console comprise.


        ⚠️ IL FAUT PROUVER QUI ON EST — `password`, ou `code` pour un compte né
        par code (demandez-en un par `POST /auth/otp`, il est consommé ici).
        L'opération est irréversible : sans cette preuve, un téléphone
        déverrouillé posé sur une table suffirait à faire disparaître le compte
        de quelqu'un.


        ⚠️ AFFICHEZ `erase_at`. « Votre compte est fermé, vos données seront
        effacées le 6 novembre » se comprend ; « compte supprimé » suivi d'un
        historique encore lisible chez le support ne se comprend pas. Pendant
        ce délai, le support peut ANNULER la suppression — c'est le seul
        recours de quelqu'un qui a touché le bouton par erreur.


        ⚠️ CLIENTS SEULEMENT (403 `erasure_not_self_serve`). Un chauffeur, un
        livreur ou un marchand porte des versements et parfois une dette qui
        vivent dans la verticale, et un compte de staff n'est pas à soi : pour
        eux, la suppression passe par le support, qui a le grand livre sous les
        yeux avant de décider.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password: {type: string, description: Pour un compte qui en a un}
                code:
                  type: string
                  description: >-
                    Pour un compte né par code — les six chiffres d'un
                    `POST /auth/otp`, consommés ici.
      responses:
        "200":
          description: Closed, erasure scheduled
          content:
            application/json:
              schema:
                type: object
                required: [status, erase_at]
                properties:
                  status: {type: string, enum: [closed]}
                  erase_at:
                    type: string
                    format: date-time
                    description: Quand le nom, le téléphone et les adresses s'en vont.
        "401": {description: invalid_credentials}
        "403": {description: erasure_not_self_serve}
        "409": {description: wallet_not_empty, deletion_already_requested}
        "422": {description: otp_invalid, ou aucune preuve fournie}
  /countries:
    get:
      tags: [countries]
      summary: Countries where Dira is open
      security: []
      description: >-
        PUBLIC. Les pays OUVERTS, avec leur fiche : nom, MONNAIE (code,
        symbole, décimales — ce qu'il faut pour afficher un montant),
        indicatif, langue, fuseau, centre. `default` nomme le pays du déploiement —
        celui qu'une requête sans jeton ni en-tête reçoit. Cinq pays sont
        ouverts d'office : Togo, Sénégal, Guinée, Tchad, Gabon. Une application
        s'en sert avant toute connexion : proposer l'indicatif à
        l'inscription, dire « Dira n'est pas encore chez vous ».
      description: >-
        Les pays OUVERTS, avec leur monnaie EN VIGUEUR et leur **fond de carte
        par défaut** (`basemap` : `dira` | `google`, v4.41.0).


        ⚠️ **`basemap` est ici parce que le bloc `maps` de l'authentification ne
        suffit pas** : celui-ci voyage avec le jeton, donc il dit le fond du pays
        où l'on s'est CONNECTÉ, une fois. Une application qui change de pays sans
        se reconnecter garderait le fond de la veille. Ce catalogue, lui, se
        relit à chaque ouverture.
      responses:
        "200":
          description: Open countries
          content:
            application/json:
              schema:
                type: object
                properties:
                  default: {type: string, example: TG}
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Country"}
  /me/country/resolve:
    post:
      tags: [countries, users]
      summary: Resolve the caller's country and align the account
      description: >-
        « Dans quel pays suis-je ? ». Deux signaux, dans l'ordre : la
        POSITION de l'appareil (`lng`, `lat`), si l'application l'envoie —
        c'est la vérité, à cent mètres près ; puis l'ADRESSE IP de la
        requête, sans position ou quand la position est hors zone. Un signal
        qui désigne un pays non ouvert ne vaut pas : `supported: false`,
        `detected` dit où la personne est, et `country` reste celui du
        compte (ou le pays par défaut).


        Le pays du compte est MIS À JOUR quand le pays retenu est sûr et
        différent (`updated: true`). ⚠️ Le jeton en cours porte encore
        l'ancien : l'application doit RAFRAÎCHIR sa session pour voir ses
        listes bornées au nouveau pays. Corps vide admis (IP seule).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                lng: {type: number, minimum: -180, maximum: 180}
                lat: {type: number, minimum: -90, maximum: 90}
      responses:
        "200":
          description: Resolution
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CountryResolution"}
        "422": {description: lng and lat go together}
  /admin/countries:
    get:
      tags: [admin, countries]
      summary: The whole catalog with each country's state
      description: >-
        Tout le catalogue — ouverts ou non — pour l'écran de réglage. Le
        catalogue lui-même (frontières, monnaies) est dans le code :
        ouvrir un pays qui n'y est pas demande un déploiement.
      responses:
        "200": {description: Catalog}
  /admin/countries/{code}:
    put:
      tags: [admin, countries]
      summary: Open or close a country, set its currency
      description: >-
        Les deux champs sont facultatifs — on change l'un sans toucher à
        l'autre. `currency` : un code ISO 4217 connu (`XOF`, `XAF`, `GNF`,
        `GHS`, `NGN`, `EUR`, `USD`) ; vide = revenir à la monnaie du
        catalogue. ⚠️ La monnaie se DÉCLARE, elle ne convertit rien : les
        montants créés sous ce pays sont dans cette monnaie, en entiers de sa
        plus petite unité.
      parameters:
        - {name: code, in: path, required: true, schema: {type: string, example: BJ}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: {type: boolean}
                currency: {type: string, example: GNF}
                testing:
                  type: boolean
                  description: >-
                    Réserve ce pays aux ESSAIS. ⚠️ Ses chiffres ne comptent alors
                    ni dans la supervision, ni dans les rapports périodiques —
                    sans quoi un test de charge qui crée cinq cents courses
                    ferait monter le tableau « est-ce que ça va ? » et partir un
                    rapport annonçant une journée record. ⚠️ Refusé sur le pays
                    par DÉFAUT (`409 country_default_testing`) : c'est celui où
                    atterrit le trafic réel, et l'y marquer ferait disparaître la
                    moitié de la plateforme des tableaux, en silence.
      responses:
        "200": {description: Country}
        "404": {description: country_unknown — not in the catalog}
        "409": {description: country_default — the default country cannot be closed}
        "422": {description: unknown currency, or nothing to update}
  /admin/countries/{code}/maps:
    get:
      tags: [admin, countries]
      summary: The country's default basemap
      description: >-
        UN SEUL FAIT : `dira` ou `google`, le fond qu'on montre d'abord dans ce
        pays. ⚠️ Plus aucune clé ici (v4.40.0) : chaque application porte la
        sienne, restreinte à son empreinte.
      parameters:
        - {name: code, in: path, required: true, schema: {type: string, example: SN}}
      responses:
        "200":
          description: Basemap setting
          content:
            application/json:
              schema:
                type: object
                properties:
                  basemap: {type: string, enum: [dira, google]}
        "404": {description: country_unknown — not in the catalog}
    put:
      tags: [admin, countries]
      summary: Set the country's default basemap
      description: >-
        `basemap` est le fond par DÉFAUT du pays — la case cochée d'avance ; la
        personne choisit ensuite celui qui lui va, et son choix vit chez elle.


        ⚠️ LE SERVEUR NE GARDE PLUS DE CLÉ GOOGLE (v4.40.0). Il en a gardé une
        par pays et par plateforme du 22 au 29 septembre 2026, pour la faire
        tourner sans republier les applications. Chaque frontend porte déjà la
        sienne, restreinte à son empreinte SHA-1, à son bundle ou à son référent
        HTTP — c'est cette restriction qui protège une clé, et elle appartient à
        la plateforme, pas au pays. Ce réglage ne décide donc QUE du défaut.
      parameters:
        - {name: code, in: path, required: true, schema: {type: string, example: SN}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                basemap: {type: string, enum: [dira, google]}
      responses:
        "200": {description: "Le fond par défaut du pays : {basemap}"}
        "404": {description: country_unknown — not in the catalog}
        "422": {description: nothing to update — send basemap}
  /admin/countries/{code}/privacy:
    get:
      tags: [admin, countries]
      summary: "QUI VOIT QUOI DE QUI entre un client et l'agent qui le sert (v4.49.0)"
      description: >-
        **La politique de confidentialité d'un pays, métier par métier.** Ce
        qu'un client voit de son chauffeur ou de son livreur, et ce que
        celui-ci voit de son client : nom (quatre niveaux), prénom, nom de
        famille, photo, genre, note — et les trois canaux de contact.


        ⚠️ **PAR MÉTIER, et c'est la décision qui porte le reste.** En
        livraison, le livreur **encaisse** en espèces et cherche un portail qui
        ne s'ouvre pas : le téléphone est un outil de travail. En course, il n'a
        aucun de ces besoins — la conversation suffit. Une politique unique
        aurait obligé à trancher pareil pour les deux, donc à casser l'un des
        deux.


        ⚠️ **`audience` NOMME QUI REGARDE**, et non « de qui » : `client` = ce
        qu'un client voit de l'agent, `agent` = ce qu'un agent voit de son
        client. Une flèche à interpréter serait une divulgation à l'envers.


        ⚠️ **LES TROIS CANAUX DE CONTACT NE SONT PAS LA MÊME PERMISSION.**
        `phone` affiche le numéro — il sort de la plateforme dès qu'il est à
        l'écran, par recopie ou capture. `direct_call` propose un **bouton
        d'appel** : joindre d'un geste sans repartir avec les coordonnées.
        `in_app_alert` fait **sonner** l'application de l'autre — le klaxon des
        courses, qui existe précisément parce qu'aucun numéro ne s'échange.


        ⚠️ **`direct_call` SANS `phone` EST DE LA FRICTION, PAS DU SECRET** :
        pour composer, le téléphone doit connaître le numéro, donc il arrive sur
        l'appareil et atterrit dans son **journal d'appels**. Ce que le réglage
        retire, c'est l'affichage, la recopie et la capture d'écran. Le seul
        masquage réel serait un relais chez un opérateur, qui n'est pas branché.


        La réponse est toujours **complète**, les deux métiers et les deux sens,
        tous les champs posés : un pays jamais réglé rend les **défauts du
        métier**, qui reproduisent exactement ce qui s'échangeait avant ce
        réglage — course : nom et note au passager, rien au chauffeur sauf le
        klaxon ; livraison : nom, note, numéro et appel dans les deux sens.
      parameters:
        - {name: code, in: path, required: true, schema: {type: string, example: GN}}
      responses:
        "200":
          description: Privacy policy, both verticals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryPrivacy"
        "404": {description: unknown_country}
    put:
      tags: [admin, countries]
      summary: "Régler UN sens d'UN métier (v4.49.0)"
      description: >-
        ⚠️ **UN SEUL SENS PAR APPEL, exprès.** Un formulaire qui enverrait les
        quatre divulgations d'un coup rendrait impossible de dire, dans le
        journal d'audit, laquelle vient de changer — et c'est précisément la
        question qu'on posera après un incident. L'entrée d'audit nomme le
        métier, le public et l'état obtenu.


        `vertical` et `audience` sont obligatoires ; le reste est facultatif —
        on change un champ sans réécrire les autres. Un corps sans aucun champ
        réglable est refusé (`422`).
      parameters:
        - {name: code, in: path, required: true, schema: {type: string, example: GN}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vertical, audience]
              properties:
                vertical: {type: string, enum: [vtc, food]}
                audience:
                  type: string
                  enum: [client, agent]
                  description: QUI REGARDE — `client` voit l'agent, `agent` voit son client.
                name:
                  type: string
                  enum: [full, first, initials, hidden]
                  description: >-
                    Quatre niveaux et non un interrupteur : « A. D. » laisse
                    reconnaître la personne qui arrive sans la nommer.
                first_name: {type: boolean, description: Le prénom d'état civil, distinct du nom d'affichage}
                last_name: {type: boolean, description: Le nom de famille — ce qui identifie vraiment dans une ville}
                photo: {type: boolean}
                gender: {type: boolean, description: Servi nulle part par défaut ; à n'ouvrir que si un marché l'exige}
                rating: {type: boolean, description: Une PERMISSION — la note vit dans la verticale}
                phone: {type: boolean, description: Le numéro est AFFICHÉ}
                direct_call: {type: boolean, description: Un BOUTON D'APPEL est proposé}
                in_app_alert: {type: boolean, description: On peut faire SONNER l'application de l'autre}
      responses:
        "200":
          description: Privacy policy, both verticals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryPrivacy"
        "404": {description: unknown_country}
        "422": {description: nothing to update, or an unknown level}
  /admin/countries/{code}/security:
    get:
      tags: [admin, countries]
      summary: The country's app-lock policy
      description: >-
        **Le VERROU des applications** — biométrie ou code secret devant
        l'application. ⚠️ **C'est une POLITIQUE, pas un contrôle d'accès** : le
        verrou vit dans le téléphone, le serveur ne peut ni le poser, ni
        vérifier qu'il y est, ni savoir si l'appareil resté à la maison est
        verrouillé. Ce réglage dit ce que les applications doivent **proposer**
        ou **imposer** dans ce pays. Ne jamais faire reposer la protection
        d'une donnée dessus : ce qui protège, c'est le jeton en stockage
        sécurisé et sa durée de vie.


        La réponse est toujours **complète** — tous les champs posés, aucun à
        deviner : un pays jamais réglé rend les défauts (`optional`, biométrie
        admise, code à 4 chiffres, 120 s de grâce, 5 essais).
      parameters:
        - {name: code, in: path, required: true, schema: {type: string, example: GN}}
      responses:
        "200":
          description: App-lock policy
          content:
            application/json:
              schema:
                type: object
                properties:
                  app_lock:
                    type: object
                    properties:
                      mode: {type: string, enum: [off, optional, required]}
                      biometrics: {type: boolean}
                      pin_length: {type: integer, enum: [4, 6]}
                      grace_seconds: {type: integer}
                      max_attempts: {type: integer}
                  sessions:
                    type: object
                    properties:
                      max_devices:
                        type: integer
                        description: >-
                          Appareils simultanés d'un compte ORDINAIRE — client,
                          marchand, staff. Défaut **3**. Au-delà, la session la
                          plus silencieuse est déconnectée.
                      agent_max_devices:
                        type: integer
                        description: >-
                          Toujours **1**, et rendu pour être AFFICHÉ, pas réglé.
                          ⚠️ Un chauffeur ou un livreur connecté sur deux
                          téléphones pousse deux flux de positions pour un seul
                          véhicule : le vivier voit la voiture à deux endroits
                          et l'appel part vers le téléphone resté à la maison.
                          Ce n'est pas un réglage de sécurité, c'est le
                          dispatch.
        "404": {description: country_unknown — not in the catalog}
    put:
      tags: [admin, countries]
      summary: Set the country's app-lock and device policy
      description: >-
        Tout est facultatif : on change un champ sans réécrire les autres.


        ⚠️ **`required` N'EST PAS ANODIN.** Quelqu'un dont le capteur est cassé
        et qui oublie son code se retrouve dehors, et sa seule sortie est de se
        reconnecter — c'est pour cela que le code secret reste **toujours**
        possible à côté de la biométrie, et que les échecs **déconnectent** au
        lieu de bloquer : un téléphone volé qui se bloque garde un jeton de
        rafraîchissement valide trente jours ; déconnecté, il ne garde rien.


        ⚠️ **`grace_seconds` décide si le verrou sera supporté ou contourné.**
        Redemander à chaque retour d'arrière-plan — pour lire un SMS, pour
        ouvrir une carte — fait désactiver le verrou ou désinstaller
        l'application. Zéro reste possible, et se choisit pour un parc de
        téléphones partagés.


        La politique atteint les applications **avec le jeton** (`app_lock`
        dans la réponse de connexion, d'inscription et de vérification de code)
        **et au rafraîchissement** — sans quoi un pays qui vient d'imposer le
        verrou n'atteindrait une application déjà connectée que trente jours
        plus tard. `GET /countries` la porte aussi, pour l'application qui
        change de pays sans se reconnecter.
      parameters:
        - {name: code, in: path, required: true, schema: {type: string, example: GN}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: {type: string, enum: [off, optional, required]}
                biometrics:
                  type: boolean
                  description: >-
                    Faux = **code secret seul**. Le code reste toujours
                    possible à côté de la biométrie : un capteur cassé ne doit
                    enfermer personne dehors.
                pin_length: {type: integer, enum: [4, 6]}
                grace_seconds: {type: integer, minimum: 0, maximum: 3600}
                max_attempts: {type: integer, minimum: 3, maximum: 10}
                max_devices:
                  type: integer
                  minimum: 1
                  maximum: 10
                  description: >-
                    **Appareils simultanés d'un compte ordinaire** — client,
                    marchand, staff. Défaut **3** : le téléphone, la tablette,
                    et celui qu'on vient de changer sans penser à se
                    déconnecter de l'ancien.


                    Au-delà, la session **la plus silencieuse** est
                    déconnectée — pas la première ouverte : une session est
                    datée de son dernier rafraîchissement, donc le téléphone
                    dont on se sert tous les jours se redate seul et celui qui
                    dort dans un tiroir part le premier. L'appareil évincé voit
                    sa session expirer au prochain rafraîchissement.


                    ⚠️ **Sans effet sur les chauffeurs et les livreurs** : eux
                    gardent **un** appareil, pour le dispatch, et cela ne se
                    règle pas. ⚠️ **Une installation qui revient ne consomme
                    pas de place** quand l'application déclare son `device_id` :
                    c'est le même téléphone, sa session précédente est
                    remplacée.
      responses:
        "200": {description: "La politique du pays, complète"}
        "404": {description: country_unknown — not in the catalog}
        "422": {description: nothing to update — send at least one field}
  /map-markers:
    get:
      tags: [map-markers]
      summary: The platform's map markers — courier, client, merchant — with their images
      description: |
        PUBLIC, sans jeton : une application dessine des cartes avant même la
        connexion. Toujours les TROIS genres, dans cet ordre — `courier` (le
        livreur ; le chauffeur VTC est dessiné par son mode de véhicule),
        `client`, `merchant` (le point de vente, la collecte).

        Chacun porte deux images FACULTATIVES, comme un mode de véhicule :
        `icon_url` (à côté d'un nom, dans une liste) et `map_icon_url` (dans
        la pastille du marqueur). Absentes, gardez votre pictogramme — le
        réglage ajoute, il ne retire rien.

        ⚠️ **LES PINS NUMÉROTÉS (v4.18.0).** `client` et `merchant` portent en
        plus jusqu'à **quatre** pins numérotés (`numbered`, rangs 1 à 4,
        toujours servis au complet même vides). Une carte porte souvent
        plusieurs points du même genre — une commande collectée chez trois
        marchands, une course qui s'arrête deux fois — et un seul pictogramme
        pour tous ces points ne dit pas dans quel ORDRE on y passe, qui est
        justement ce qu'on cherche.

        Le rang est celui du PASSAGE : la 1re collecte porte le pin 1.
        Au-delà de `max_numbered`, ou quand le rang n'est pas réglé,
        **retombez sur le pin principal** — c'est prévu, pas une panne.

        ⚠️ **`stop` A FUSIONNÉ DANS `client`.** Un arrêt de course et l'adresse
        d'un client sont le même objet vu à deux moments. Les étapes d'une
        course se dessinent avec les pins numérotés du client.

        Mettez les images en cache par URL : elles changent d'URL quand elles
        changent. Pour toute la plateforme, pas par pays.
      responses:
        "200":
          description: Markers
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/MapMarker"}
  /admin/map-markers/{kind}:
    put:
      tags: [admin, map-markers]
      summary: Set (or clear) the images of a map marker
      description: |
        Exploitation du socle. La requête décrit l'ÉTAT VOULU : les champs
        omis sont effacés, y compris les pins numérotés — un enregistrement
        partiel aurait laissé traîner un pin qu'on croyait retiré. Les images
        s'envoient par `POST /uploads?kind=marker`.

        Un rang hors bornes ou en double est REFUSÉ (422), jamais ignoré : un
        pin silencieusement écarté se remarque des semaines plus tard. Un pin
        sans image est en revanche écarté — c'est ainsi qu'on en retire un.
      parameters:
        - {name: kind, in: path, required: true, schema: {type: string, enum: [courier, client, merchant]}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                icon_url: {type: string, format: uri}
                map_icon_url: {type: string, format: uri}
                nav_icon_url: {type: string, format: uri, description: "refusé pour un genre qui ne bouge pas"}
                dest_icon_url: {type: string, format: uri, description: "refusé pour un genre qui n'est la destination de personne"}
                numbered:
                  type: array
                  maxItems: 4
                  description: "refusé pour `courier` : il n'y a qu'un livreur par course"
                  items:
                    type: object
                    properties:
                      index: {type: integer, minimum: 1, maximum: 4}
                      map_icon_url: {type: string, format: uri}
      responses:
        "200": {description: Marker, content: {application/json: {schema: {$ref: "#/components/schemas/MapMarker"}}}}
        "404": {description: marker_not_found — unknown kind}
        "422": {description: rang de pin hors bornes, en double, ou genre qui n'en porte pas}
  /me/preferences:
    patch:
      tags: [users]
      summary: Update notification, theme and language preferences
      description: >-
        Champs absents inchangés. `locale` ∈ `fr` | `en` — les deux langues
        de la plateforme ; `fr-FR` est ramené à `fr`, autre chose est refusé
        (422, `fields: ["locale"]`) ; vide = revenir à la langue de
        l'appareil. `theme` ∈ system | light | dark. `sounds` est accepté
        mais l'app chauffeur ne l'écrit plus (réglage devenu local).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                order_updates: {type: boolean}
                chat_messages: {type: boolean}
                promotions: {type: boolean}
                tombola: {type: boolean}
                sounds: {type: boolean}
                theme: {type: string, enum: [system, light, dark]}
                locale: {type: string, enum: [fr, en, ""]}
                payment_provider: {type: string}
      responses:
        "200": {description: Profile}
        "422": {description: validation_failed}
  /me/addresses:
    get:
      tags: [users]
      summary: Own address book
      responses:
        "200": {description: Addresses}
    post:
      tags: [users]
      summary: Save an address
      responses:
        "201": {description: Address}
  /me/addresses/{id}:
    put:
      tags: [users]
      summary: Update an address
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Address}
    delete:
      tags: [users]
      summary: Delete an address
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "204": {description: Deleted}
  /uploads:
    post:
      tags: [uploads]
      summary: Upload a media file and get its public URL
      description: >-
        Tout rôle connecté. AU SOCLE, pas dans une verticale : un avatar est
        un objet du profil, une photo de véhicule ou un permis servent aux
        deux métiers, et les courses n'avaient aucune porte d'envoi. L'URL
        rendue se rattache ensuite à l'objet (`PATCH /me`, véhicule,
        document de conformité, plat…) — l'étape est séparée pour qu'un
        envoi qui échoue ne fasse pas perdre la saisie.


        Images (jpeg, png, webp, svg) jusqu'à 5 MiB pour tout `kind`. Le
        `kind` `feed` accepte AUSSI des vidéos (mp4, webm, mov) jusqu'à
        60 MiB — un clip promo pèse des dizaines de mégaoctets, rien d'autre
        ne doit profiter de ce plafond. Une vidéo de feed est un SHORT : la
        durée est lue dans le conteneur, jamais déclarée, et au-delà de 60 s
        c'est `video_too_long` ; un conteneur illisible est `video_unreadable`
        plutôt qu'accepté à l'aveugle. La durée mesurée revient dans
        `duration_seconds`.


        ⚠️ Le type est celui DÉCLARÉ par la part multipart ; le serveur ne
        renifle pas le contenu.
      parameters:
        - {in: query, name: kind, required: true, schema: {type: string, enum: [avatar, vehicle, dish, store, brand, feed, banner, class, equipment, marker]}, description: "préfixe de la clé d'objet ; `class` = pictogrammes des modes de véhicule, `equipment` = photos du matériel du catalogue, `marker` = pictogrammes des marqueurs de carte (console)"}
        - {in: query, name: entity, schema: {type: string}, description: identifiant facultatif qui regroupe les objets}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {type: object, required: [file], properties: {file: {type: string, format: binary}}}
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: {type: string, format: uri}
                  duration_seconds: {type: integer, description: "vidéos seulement : lue dans le conteneur"}
        "401": {description: missing_token}
        "422": {description: "validation_failed (type, poids, kind, champ `file` absent), video_too_long, video_unreadable"}
        "503": {description: storage_unavailable — le stockage d'objets n'a pas démarré}
  /wallet:
    get:
      tags: [wallet]
      summary: Own wallet
      responses:
        "200": {description: Balance}
  /wallet/transactions:
    get:
      tags: [wallet]
      summary: Own ledger
      responses:
        "200": {description: Movements}
  /wallet/purchase:
    post:
      tags: [wallet]
      summary: Buy tokens
      responses:
        "201": {description: Payment started}
  /admin/fleets:
    get:
      tags: [admin, fleet]
      summary: List private fleets
      description: >
        Les sociétés qui possèdent des véhicules conduits par d'autres. Au
        socle et non dans une verticale : une même société possède des motos
        qui livrent et des voitures qui font des courses.
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [active, suspended, closed]}
          description: >-
            `closed` = suppression demandée (v4.47.0) : le compte ne se
            reconnecte plus et son identité part à l'échéance du délai de grâce.
            Distinct de `suspended`, qui se lève.
        - {name: q, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        "200": {description: Fleets}
    post:
      tags: [admin, fleet]
      summary: Register a fleet
      description: >
        `commission_bp` ABSENT signifie « suit le taux de la plateforme » ;
        zéro signifie une gratuité négociée. Les deux ne se confondent pas.
      responses:
        "201": {description: Created}
        "409": {description: A fleet already carries this name}
  /admin/fleets/{id}:
    get:
      tags: [admin, fleet]
      summary: One fleet
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Fleet}
        "404": {description: Not found}
    patch:
      tags: [admin, fleet]
      summary: Update a fleet
      description: >
        Chaque champ est facultatif et seul ce qui est envoyé change.
        Suspendre une flotte ne suspend PAS ses conducteurs : ce sont deux
        décisions distinctes.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Fleet}
        "404": {description: Not found}
  /admin/staff:
    get:
      tags: [admin, staff]
      summary: List Dira staff
      description: >
        Un membre du staff EST un compte `admin`, avec une fonction et un
        PÉRIMÈTRE. ⚠️ `scopes` VIDE N'ACCORDE RIEN : couvrir toute la
        plateforme s'écrit en énumérant les trois portées. `covers_everything`
        est un résumé calculé, `scopes` reste la seule vérité.
      parameters:
        - {name: function, in: query, schema: {type: string}}
        - {name: scope, in: query, schema: {type: string, enum: [core, food, vtc]}}
        - {name: status, in: query, schema: {type: string, enum: [active, suspended]}}
        - {name: limit, in: query, schema: {type: integer}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        "200": {description: Staff}
    post:
      tags: [admin, staff]
      summary: Attach a staff record to an admin account
      description: >
        Le compte doit déjà porter le rôle `admin`, et au moins une portée est
        exigée : une fiche qui n'accorde rien fait croire à une habilitation.
        ⚠️ Réservé aux membres dont la FONCTION est `admin` — une habilitation
        qu'on peut s'accorder soi-même n'en est pas une.
      responses:
        "201": {description: Created}
        "409": {description: This account already has a staff record}
        "422": {description: Validation failed}
  /admin/staff/vocabulary:
    get:
      tags: [admin, staff]
      summary: Known functions and scopes
      description: >
        Pour que la console propose exactement ce que le serveur accepte.
        Deux listes recopiées divergeraient au premier ajout.
        `empty_scopes_means` vaut `nothing`.
      responses:
        "200": {description: Vocabulary}
  /admin/staff/{id}:
    patch:
      tags: [admin, staff]
      summary: Update a staff record
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Staff member}
        "404": {description: Not found}
    delete:
      tags: [admin, staff]
      summary: Remove a staff record
      description: >
        Retire la FICHE, pas le COMPTE : les actions passées restent
        attribuées dans le journal d'audit.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "204": {description: Removed}
        "404": {description: Not found}
  /admin/wallets/{ownerID}:
    get:
      tags: [wallet]
      summary: One wallet, whoever owns it
      description: >-
        GÉNÉRIQUE : un propriétaire est un point de vente, un livreur ou un
        chauffeur — le socle ne fait pas la différence, et n'a pas à la faire.
      parameters: [{name: ownerID, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Wallet}
  /admin/wallets/{ownerID}/purchase:
    post:
      tags: [wallet]
      summary: Start a token purchase for an owner
      description: Initie un vrai paiement, à honorer.
      parameters: [{name: ownerID, in: path, required: true, schema: {type: string}}]
      responses:
        "201": {description: Payment started}
  /admin/wallets/{ownerID}/credit:
    post:
      tags: [wallet]
      summary: Grant tokens without payment
      description: >-
        ⚠️ SANS contrepartie financière — un geste commercial. Justificatif
        exigé, et l'écriture porte la trace de qui l'a accordé.
      parameters: [{name: ownerID, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Wallet}
  /admin/wallets/{ownerID}/transactions:
    get:
      tags: [wallet]
      summary: One wallet's ledger
      description: >-
        Le grand livre d'UN portefeuille, désigné par son propriétaire — la
        fiche d'un compte. Chaque mouvement dit son `unit` (`token` ou
        `xof`) : un relevé n'additionne pas des jetons et des francs.
      parameters:
        - {name: ownerID, in: path, required: true, schema: {type: string}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer}}
      responses:
        "200": {description: Transactions}
        "404": {description: wallet_not_found}
  /admin/wallets/{ownerID}/promo:
    post:
      tags: [wallet]
      summary: Grant a promotional credit (XOF) to a client
      description: >-
        Un geste commercial en ARGENT — dépensé avant l'argent réel du
        client, jamais confondu avec lui au grand livre (`promo_credit`).
        Justificatif exigé, journal d'audit. Le portefeuille est créé s'il
        n'existe pas.
      parameters: [{name: ownerID, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_xof, justification]
              properties:
                amount_xof: {type: integer, minimum: 1}
                justification: {type: string, minLength: 3, maxLength: 500}
      responses:
        "200": {description: Wallet}
  /admin/wallets:
    get:
      tags: [wallet]
      summary: Les portefeuilles du pays courant — quatre soldes et le titulaire
      parameters:
        - {name: type, in: query, schema: {type: string, enum: [client, driver, merchant]}}
        - {name: owner_id, in: query, schema: {type: string}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, maximum: 100}}
      responses:
        "200": {description: "Wallets — `balance` (jetons), `balance_xof`, `promo_xof`, `debt_xof`, `owner_name` pour un compte (une boutique reste un identifiant)"}
  /admin/ledger:
    get:
      tags: [wallet]
      summary: Les mouvements de tous les portefeuilles du pays courant, les derniers d'abord
      description: >-
        Chaque ligne dit son UNITÉ (`token` ou `xof`), son motif, ce qu'elle
        paie (`ref_kind`, `ref_id`), son titulaire, et `ref` (la source d'un
        paiement, `debt_delta` d'un mouvement de dette). `amount` est TOUJOURS
        positif : le sens vient de `kind` (`purchase` crédite, `consume`
        débite).
      parameters:
        - {name: wallet_id, in: query, schema: {type: string}}
        - {name: owner_type, in: query, schema: {type: string, enum: [client, driver, merchant]}}
        - {name: unit, in: query, schema: {type: string, enum: [token, xof]}}
        - {name: reason, in: query, schema: {type: string}}
        - {name: ref_kind, in: query, schema: {type: string}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, maximum: 100}}
      responses:
        "200": {description: Ledger rows}
  /admin/wallets/{ownerID}/settle-debt:
    post:
      tags: [wallet]
      summary: Une dette réglée à l'agence (espèces, mobile money), hors solde
      description: >-
        `debt_xof` d'un portefeuille : la commission d'une course en espèces
        que le solde n'a pas pu payer, un paiement refusé à la livraison.
        Remboursée d'office sur le prochain crédit en argent ; ici, ce qui a
        été réglé en main propre. Jamais plus que la dette (422).
      parameters: [{name: ownerID, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_xof]
              properties:
                amount_xof: {type: integer, minimum: 1}
                note: {type: string, maxLength: 300}
      responses:
        "200": {description: Wallet — `debt_xof` mis à jour}
  /admin/finance/billing:
    get:
      tags: [finance]
      summary: La facturation du pays courant
      description: >-
        Par métier (`rides`, `deliveries`) : `agent_charge` ∈ tokens |
        commission, `commission_pct`, la grille de jetons (`tokens_per_ride`,
        `tokens_per_km`, `tokens_min`, `tokens_max` — la livraison garde sa
        grille `platform_pricing` quand ils sont à zéro), `client_charge_at` ∈
        request | accept | start | complete (portefeuille Dira seulement —
        le mobile money se paie d'avance, les espèces à la remise),
        `debt_limit_xof`. Défauts : courses en commission à la classe, client
        débité à l'acceptation ; livraison en jetons, client débité à la
        commande. Les verticales le lisent (`GET /internal/finance/billing`).
      responses:
        "200":
          description: Billing
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Billing"}
    put:
      tags: [finance]
      summary: Régler la facturation du pays courant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rides: {$ref: "#/components/schemas/VerticalBilling"}
                deliveries: {$ref: "#/components/schemas/VerticalBilling"}
      responses:
        "200": {description: Billing}
        "422": {description: "`invalid billing` — `reason` dit quoi"}
  /admin/finance/overview:
    get:
      tags: [finance]
      summary: L'aperçu comptable d'une période
      description: >-
        La balance des comptes du plan (débit, crédit, solde — un passif est
        ce que la plateforme doit, un produit ce qu'elle a gagné), les
        indicateurs (`kpis` : produits par nature, charges, net, passifs,
        créances, transit, à classer, encaissé), le détail par motif et par
        jour, l'état des portefeuilles à l'instant (`wallets`), le nombre de
        constats ouverts et le dernier balayage. `balanced` dit si la période
        s'équilibre. Défaut : le dernier mois.
      parameters:
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
      responses:
        "200": {description: Overview}
  /admin/finance/journal:
    get:
      tags: [finance]
      summary: Le journal — une écriture par mouvement, en partie double
      parameters:
        - {name: account, in: query, schema: {type: string}, description: un compte du plan (`GET /admin/finance/accounts`)}
        - {name: reason, in: query, schema: {type: string}}
        - {name: service, in: query, schema: {type: string, enum: [core, vtc, food]}}
        - {name: ref_kind, in: query, schema: {type: string}}
        - {name: ref_id, in: query, schema: {type: string}}
        - {name: owner_id, in: query, schema: {type: string}}
        - {name: unit, in: query, schema: {type: string, enum: [xof, token]}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, maximum: 200}}
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/AccountingEntry"}}
                  next_cursor: {type: string}
  /admin/finance/accounts:
    get:
      tags: [finance]
      summary: Le plan comptable (code, nature, libellé)
      responses:
        "200": {description: Accounts}
  /admin/finance/findings:
    get:
      tags: [finance]
      summary: Les constats du balayage d'intégrité
      description: >-
        `wallet_drift` (un solde stocké ≠ la somme de ses mouvements — jetons,
        argent, promo ou dette), `negative_balance`, `missing_entry` (un
        mouvement sans écriture), `entry_unbalanced`, `trial_unbalanced` (la
        balance générale). Dédoublonnés par empreinte, `occurrences` et
        `last_seen_at` disent depuis quand ; un écart disparu passe
        `resolved` au balayage suivant. `status` ∈ open | acknowledged |
        resolved (défaut : non résolus).
      parameters: [{name: status, in: query, schema: {type: string}}]
      responses:
        "200": {description: Findings, avec `last_run`}
  /admin/finance/findings/{id}/ack:
    post:
      tags: [finance]
      summary: Prendre acte d'un constat (avec une note)
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {note: {type: string, maxLength: 500}}}
      responses:
        "200": {description: Finding}
  /admin/finance/integrity/run:
    post:
      tags: [finance]
      summary: Lancer le balayage d'intégrité maintenant
      description: >-
        Le même que celui qui tourne à cadence fixe
        (`FINANCE_INTEGRITY_INTERVAL`, 15 min). Chaque constat NOUVEAU alerte
        le staff de portée `core` du pays (`staff_finance_alert`).
      responses:
        "200": {description: "Run : portefeuilles vus, écritures, constats, nouveaux, résolus"}
  /admin/finance/declarations:
    get:
      tags: [finance]
      summary: Les entrées et sorties d'argent déclarées
      description: >-
        L'argent qui entre et sort SANS passer par un portefeuille : un loyer,
        du carburant, un apport d'associé, une subvention, une amende, l'achat
        d'un véhicule. Les plus récentes d'abord, curseur sur `id`. Bornées au
        pays de la requête.
      parameters:
        - {name: direction, in: query, schema: {type: string, enum: [in, out]}}
        - {name: category, in: query, schema: {type: string}}
        - {name: means, in: query, schema: {type: string, enum: [cash, bank, mobile_money]}}
        - {name: status, in: query, schema: {type: string, enum: [posted, reversed]}}
        - {name: source, in: query, schema: {type: string}, description: "`console`, ou le module qui a déclaré"}
        - {name: q, in: query, schema: {type: string}, description: cherche dans la contrepartie et la pièce}
        - {name: from, in: query, schema: {type: string, format: date}, description: sur la date de VALEUR}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, maximum: 200}}
      responses:
        "200":
          description: Declarations
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/MoneyDeclaration"}}
                  next_cursor: {type: string}
    post:
      tags: [finance]
      summary: Déclarer une entrée ou une sortie d'argent
      description: >-
        Produit une écriture en PARTIE DOUBLE dans le journal existant
        (`ref_kind=declaration`, `ref_id` = l'identifiant de la déclaration) :
        une sortie débite le compte de la catégorie et crédite la trésorerie
        (`means`), une entrée fait l'inverse. Le compte vient de la CATÉGORIE
        (`GET /admin/finance/declaration-categories`) et il est FIGÉ sur la
        déclaration : repointer la catégorie plus tard ne réécrit pas le passé.
        Le montant est un ENTIER dans la plus petite unité de la monnaie du
        pays ; `currency`, si envoyé, doit être celle du pays. `value_date` ne
        peut pas être dans le futur. Le justificatif est obligatoire,
        `attachment_url` vient de `POST /uploads?kind=receipt`. Au journal
        d'audit (`finance.declaration.create`).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MoneyDeclarationInput"}
      responses:
        "201":
          description: MoneyDeclaration
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MoneyDeclaration"}
        "409": {description: "`declaration_duplicate` — cette pièce a déjà été déclarée dans ce pays · `corrects_not_reversed` · `corrects_already_corrected`"}
        "422": {description: "`invalid declaration` — `reason` dit quoi (catégorie inconnue, sens que la catégorie n'admet pas, date de valeur future, monnaie d'un autre pays)"}
  /admin/finance/declarations/summary:
    get:
      tags: [finance]
      summary: L'état de synthèse des entrées et sorties
      description: >-
        Les totaux `in`, `out`, `net` d'une période, par CATÉGORIE et par MOIS,
        pour le pays de la requête. Défaut : le dernier mois.

        ⚠️ Une déclaration CONTRE-PASSÉE compte DEUX faits, pas zéro : la
        somme à sa date de valeur, et la somme en négatif à la date de la
        contre-passation. Une déclaration de janvier annulée en mars laisse donc
        janvier tel qu'il était et retire la somme de mars — exactement comme le
        journal, qui ne réécrit jamais une écriture posée. `count` suit la même
        règle. `truncated` dit que le plafond de lecture (5 000 déclarations) a
        été atteint et que les totaux sont donc incomplets.
      parameters:
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
      responses:
        "200":
          description: MoneyDeclarationSummary
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MoneyDeclarationSummary"}
  /admin/finance/declarations/{id}:
    get:
      tags: [finance]
      summary: Une déclaration
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200":
          description: MoneyDeclaration
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MoneyDeclaration"}
        "404": {description: "`declaration_not_found`"}
  /admin/finance/declarations/{id}/reverse:
    post:
      tags: [finance]
      summary: Contre-passer une déclaration
      description: >-
        ⚠️ UNE ÉCRITURE NE SE MODIFIE PAS, ELLE SE CONTRE-PASSE. Rien n'est
        supprimé : la déclaration reste, son écriture reste, et une SECONDE
        écriture — les mêmes comptes, les côtés échangés — la neutralise. Elle
        est datée du JOUR OÙ ON LA FAIT, pas de la date de valeur de la
        déclaration fautive. Le motif est obligatoire. Pour corriger, déclarer à
        nouveau avec `corrects` = l'identifiant de celle-ci. Au journal d'audit
        (`finance.declaration.reverse`).
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 5, maxLength: 500}
      responses:
        "200":
          description: MoneyDeclaration — `status=reversed`, `reversal_entry_id` posée
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MoneyDeclaration"}
        "409": {description: "`declaration_not_posted` — déjà contre-passée"}
  /admin/finance/declaration-categories:
    get:
      tags: [finance]
      summary: Le catalogue des catégories de déclaration du pays
      description: >-
        Chaque catégorie pointe LE COMPTE du plan qu'elle meut, et dit dans quel
        sens elle marche (`in`, `out`, `both`). La réponse porte aussi
        `accounts` — les seuls comptes qu'une catégorie PEUT mouvoir — et
        `means`. Un pays qui n'a rien réglé reçoit le catalogue par défaut
        (loyer, eau/électricité/internet, carburant, entretien, salaires,
        impôts, amendes, immobilisation, apport, subvention, autre entrée,
        autre sortie).

        ⚠️ `accounts` EXCLUT tout compte adossé à un portefeuille (soldes
        clients, dû aux agents, jetons prépayés, transit) : une déclaration qui
        les mouvrait ferait dire au journal que la plateforme doit un argent que
        personne ne détient, et rien ne le signalerait.
      responses:
        "200":
          description: Catalogue
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MoneyDeclarationCatalog"}
    put:
      tags: [finance]
      summary: Régler le catalogue des catégories du pays
      description: >-
        ⚠️ REMPLACE LA LISTE ENTIÈRE, elle ne fusionne pas : envoyer deux
        catégories en laisse deux. Une catégorie dont on ne veut plus se
        DÉSACTIVE (`disabled`) plutôt que de disparaître — les déclarations déjà
        faites portent leur libellé et leur compte, mais la console ne saurait
        plus les nommer. Au journal d'audit
        (`finance.declaration_categories.update`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categories]
              properties:
                categories:
                  type: array
                  minItems: 1
                  maxItems: 60
                  items: {$ref: "#/components/schemas/MoneyDeclarationCategory"}
      responses:
        "200":
          description: Catalogue
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MoneyDeclarationCatalog"}
        "422": {description: "`invalid declaration categories` — `reason` dit quoi (code en double, compte non déclarable, sens inconnu)"}
