  # ---------------------------------------------------------------- matériel
  /equipment/catalogue:
    get:
      tags: [equipment]
      summary: Items offered to me (driver / courier)
      description: >-
        Le MATÉRIEL — gilet, sac, téléphone, casque — vendu, loué ou prêté aux
        livreurs et chauffeurs. `vertical` dit de quel métier on relève (le
        rôle est `driver` pour les deux). Actifs, de mon pays, pour ma
        verticale.
      parameters: [{name: vertical, in: query, required: true, schema: {type: string, enum: [food, vtc]}}]
      responses:
        "200": {description: Items, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/EquipmentItem"}}}}}}}
  /equipment/requests:
    post:
      tags: [equipment]
      summary: Ask for an item from the app
      description: >-
        Ouvert par pays (`agent_can_request`). Crée un contrat `requested` que
        l'exploitation qualifie ; l'équipe est alertée
        (`staff_equipment_requested`).
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [vertical, item_id, mode], properties: {vertical: {type: string, enum: [food, vtc]}, item_id: {type: string}, mode: {type: string, enum: [sale, rental, loan]}, quantity: {type: integer, minimum: 1, maximum: 10}, note: {type: string, maxLength: 1000}}}}}
      responses:
        "201": {description: Contract, content: {application/json: {schema: {$ref: "#/components/schemas/EquipmentContract"}}}}
        "403": {description: equipment_requests_closed}
        "409": {description: equipment_mode_not_allowed · equipment_not_offered}
  /me/equipment:
    get:
      tags: [equipment]
      summary: My contracts and where I stand
      responses:
        "200": {description: Contracts + standing, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/EquipmentContract"}}, standing: {$ref: "#/components/schemas/EquipmentStanding"}}}}}}
  /me/equipment/{id}/accept:
    post:
      tags: [equipment]
      summary: Accept the terms of a proposed contract
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Contract, content: {application/json: {schema: {$ref: "#/components/schemas/EquipmentContract"}}}}
        "409": {description: equipment_bad_status}
  /equipment/handover:
    post:
      tags: [equipment]
      summary: The holder scanned the counter's QR — accept and conclude in one gesture
      description: >-
        Le porteur scanne le QR affiché au comptoir. **Un seul appel accepte les
        conditions ET conclut la remise** : physiquement, c'est un seul moment —
        les garder séparés obligeait le porteur à accepter dans un autre écran
        pendant que le comptoir attend.


        ⚠️ **PAS SOUS `/me/equipment/{id}/…`** : celui qui scanne ne connaît
        **pas** l'identifiant du contrat — c'est le code qui le désigne.
        L'exiger dans le chemin aurait obligé l'application à devinerquel
        contrat on lui remet.


        ⚠️ **Envoyez ce que le scanner vous a donné.** Le QR porte un lien
        profond : le code nu, l'URL complète, avec ou sans tirets, en minuscules
        — tout est accepté. Inutile d'extraire le code vous-même.


        ⚠️ **Trois refus distincts, et trois gestes différents** :
        `equipment_handover_code_unknown` (plus valable ou déjà servi → demander
        un nouveau code), `equipment_handover_code_expired` (→ demander un
        nouveau code), `equipment_handover_not_yours` (→ **regarder le bon
        écran** : c'est la remise de quelqu'un d'autre). Un seul message « code
        invalide » enverrait les trois au comptoir, qui ne saurait pas lequel il
        a devant lui.


        ⚠️ **Un double appui est sans effet** : le code est consommé par une
        seule écriture atomique, et une remise déjà conclue rend simplement le
        contrat.


        **Le scan n'est pas obligatoire** : l'exploitation peut toujours
        enregistrer la remise elle-même. Le contrat garde alors
        `handed_via: "staff"` au lieu de `"scan"` — c'est ce champ qu'on regarde
        quand quelqu'un conteste.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, maxLength: 120, description: "le code, ou le lien entier rendu par le scanner"}
      responses:
        "200": {description: Contract (actif), content: {application/json: {schema: {$ref: "#/components/schemas/EquipmentContract"}}}}
        "403": {description: equipment_handover_not_yours}
        "404": {description: equipment_handover_code_unknown}
        "409": {description: "equipment_handover_code_expired · equipment_bad_status · equipment_out_of_stock"}
  /me/equipment/{id}/pay:
    post:
      tags: [equipment]
      summary: Pay from my Dira balance (couriers)
      description: >-
        Borné à ce qui reste dû. Un chauffeur VTC n'a pas de solde ici :
        `409 equipment_no_wallet` — son matériel se règle au grand livre des
        courses.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [amount_xof], properties: {amount_xof: {type: integer, minimum: 1}}}}}
      responses:
        "200": {description: Contract, content: {application/json: {schema: {$ref: "#/components/schemas/EquipmentContract"}}}}
        "402": {description: insufficient_funds}
        "409": {description: equipment_no_wallet · equipment_nothing_owed}
  /admin/equipment/settings:
    get:
      tags: [admin]
      summary: Equipment settings of the country (defaults every contract starts from)
      responses:
        "200": {description: Settings, content: {application/json: {schema: {$ref: "#/components/schemas/EquipmentSettings"}}}}
    put:
      tags: [admin]
      summary: Update the settings (audited)
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, properties: {allowed_modes: {type: array, items: {type: string, enum: [sale, rental, loan]}}, agent_can_request: {type: boolean}, require_acceptance: {type: boolean}, max_earnings_percent: {type: integer}, default_deposit_percent: {type: integer}, staff_alert_overdue: {type: boolean}, defaults: {$ref: "#/components/schemas/EquipmentPlan"}}}}}
      responses:
        "200": {description: Settings, content: {application/json: {schema: {$ref: "#/components/schemas/EquipmentSettings"}}}}
  /admin/equipment/items:
    get:
      tags: [admin]
      summary: The catalogue of the country
      parameters: [{name: active, in: query, schema: {type: boolean}}]
      responses:
        "200": {description: Items}
    post:
      tags: [admin]
      summary: Add an item
      responses:
        "201": {description: Item, content: {application/json: {schema: {$ref: "#/components/schemas/EquipmentItem"}}}}
  /admin/equipment/items/{id}:
    patch:
      tags: [admin]
      summary: Update an item (whole body)
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Item}
  /admin/equipment/contracts:
    get:
      tags: [admin]
      summary: Contracts of the country
      parameters:
        - {name: user_id, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {name: vertical, in: query, schema: {type: string, enum: [food, vtc]}}
        - {name: item_id, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        "200": {description: Contracts, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: "#/components/schemas/EquipmentContract"}}, next_cursor: {type: string}}}}}}
    post:
      tags: [admin]
      summary: Prepare a contract for a person
      description: >-
        Les réglages tombent en cascade — le contrat, puis l'article, puis le
        pays — et chaque montant absent vient de l'article. `hand_over_now`
        remet à la création (l'échéancier démarre, ce qui est dû à la remise
        est prélevé si le plan le permet). Sinon l'agent reçoit
        `equipment_contract_proposed` et accepte dans l'app quand
        `require_acceptance` l'exige.
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [user_id, vertical, item_id, mode], properties: {user_id: {type: string}, vertical: {type: string, enum: [food, vtc]}, item_id: {type: string}, quantity: {type: integer}, serial: {type: string}, mode: {type: string, enum: [sale, rental, loan]}, price_xof: {type: integer}, deposit_xof: {type: integer}, plan: {$ref: "#/components/schemas/EquipmentPlan"}, notes: {type: string}, hand_over_now: {type: boolean}}}}}
      responses:
        "201": {description: Contract, content: {application/json: {schema: {$ref: "#/components/schemas/EquipmentContract"}}}}
        "409": {description: equipment_mode_not_allowed · equipment_not_offered · equipment_out_of_stock}
        "422": {description: plan.* (fields) — earnings_percent over max…}
  /admin/equipment/contracts/{id}:
    get:
      tags: [admin]
      summary: One contract
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Contract, content: {application/json: {schema: {$ref: "#/components/schemas/EquipmentContract"}}}}
    patch:
      tags: [admin]
      summary: Serial, notes, plan — price and deposit before hand-over only
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Contract}
        "409": {description: equipment_handed_over}
  /admin/equipment/contracts/{id}/qualify:
    post:
      tags: [admin]
      summary: Turn a request into a draft the agent must accept
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Contract}
  /admin/equipment/contracts/{id}/hand-over:
    post:
      tags: [admin]
      summary: The item is handed over — the schedule starts
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Contract}
        "409": {description: equipment_not_accepted · equipment_bad_status · equipment_out_of_stock}
  /admin/equipment/contracts/{id}/handover-code:
    post:
      tags: [admin]
      summary: Mint the QR the counter shows so the holder concludes the hand-over
      description: >-
        Le comptoir affiche ce code en QR ; le porteur le scanne avec son
        application, et c'est LUI qui conclut la remise
        (`POST /equipment/handover`).


        ⚠️ **LE PROBLÈME QUE CELA RÉSOUT** : la remise était enregistrée par
        l'exploitation seule, et personne ne pouvait distinguer « le gilet a été
        remis » de « quelqu'un a cliqué sur Remettre ». La différence n'est pas
        théorique — la remise **démarre l'échéancier** : un clic de trop, et un
        livreur rembourse pendant trois mois un sac qu'il n'a jamais eu.


        ⚠️ **Le code vit CINQ MINUTES et ne sert qu'UNE fois.** Un code qui
        vivrait la journée se photographie au comptoir et se scanne le soir, de
        chez soi : la preuve « nous étions au même endroit au même moment »
        disparaît.


        ⚠️ **Un nouveau code révoque le précédent** : un comptoir qui rafraîchit
        son écran ne doit pas laisser derrière lui une collection de remises
        possibles.


        La réponse porte `item_name` et `holder_name` : affichez-les **sous le
        QR**, sinon le comptoir montre un carré noir et ne peut pas vérifier
        qu'il a le bon contrat à l'écran — deux porteurs qui attendent, deux
        onglets ouverts, et c'est la remise de l'autre qu'on fait conclure.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "201":
          description: Le code, son lien profond et sa date d'expiration
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: string, description: "16 caractères, alphabet sans O/0/I/1/L"}
                  url: {type: string, description: "le lien profond que porte le QR ; relatif si aucune base n'est réglée"}
                  expires_at: {type: string, format: date-time}
                  contract_id: {type: string}
                  item_name: {type: string}
                  holder_name: {type: string}
        "409": {description: "equipment_bad_status — le contrat n'est pas à remettre"}
  /admin/equipment/contracts/{id}/payments:
    post:
      tags: [admin]
      summary: Record a payment received by hand (cash, transfer, mobile money seen) or a waiver
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [amount_xof, source], properties: {amount_xof: {type: integer, minimum: 1}, source: {type: string, enum: [manual, mobile_money, waiver]}, note: {type: string}}}}}
      responses:
        "200": {description: Contract}
  /admin/equipment/contracts/{id}/return:
    post:
      tags: [admin]
      summary: The item comes back — condition, damage fee, deposit refund
      description: >-
        La caution est rendue (moins les dégâts) quand le plan le dit ou que
        `refund_deposit` le demande : sur le solde Dira d'un livreur à
        l'instant ; au grand livre d'un chauffeur VTC à la prochaine course.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        content: {application/json: {schema: {type: object, properties: {condition: {type: string}, damage_fee_xof: {type: integer, minimum: 0}, refund_deposit: {type: boolean}}}}}
      responses:
        "200": {description: Contract}
  /admin/equipment/contracts/{id}/cancel:
    post:
      tags: [admin]
      summary: Cancel a contract that was never handed over
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Contract}
        "409": {description: equipment_bad_status — a live contract ends by a return or a default}
  /admin/equipment/contracts/{id}/default:
    post:
      tags: [admin]
      summary: Close a contract as unpaid
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Contract}
  /admin/equipment/contracts/{id}/lines/{n}/waive:
    post:
      tags: [admin]
      summary: Waive one schedule line (a late fee, an instalment)
      parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: n, in: path, required: true, schema: {type: integer}}]
      responses:
        "200": {description: Contract}
  /admin/equipment/standing/{userID}:
    get:
      tags: [admin]
      summary: Where a person stands, all contracts together
      parameters: [{name: userID, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Standing, content: {application/json: {schema: {$ref: "#/components/schemas/EquipmentStanding"}}}}
  /internal/accounts/agent-app:
    post:
      tags: [internal]
      summary: "Une verticale RÉCLAME l'appartenance métier d'un compte (v4.37.0)"
      security: [{ bearer: [] }]
      description: >-
        Appelée par les courses et par la livraison au moment où elles
        garantissent le profil d'un agent. ⚠️ **Route interne** : la passerelle
        refuse `/api/v1/internal/` de l'extérieur, et le jeton de service est
        vérifié.


        **UN CHAUFFEUR VTC N'EST JAMAIS LIVREUR.** La doctrine n'était
        appliquée par rien : les deux profils naissaient d'une simple LECTURE,
        et un compte qui ouvrait les deux applications obtenait les deux
        métiers en silence. Cette route est l'endroit où l'autre verticale peut
        dire non.


        **IDEMPOTENTE** — elle est appelée à chaque ouverture d'application.
        Réclamer ce qui est acquis n'écrit rien et répond `200`.


        ⚠️ **C'est cette moitié qui rend la migration sûre.** On ne peut pas
        laisser « le premier qui se connecte » décider : aucun compte existant
        ne porte d'appartenance, et un livreur en place qui ouvrirait par
        curiosité l'application des courses réserverait `driver` puis se
        verrait refuser l'entrée dans SA propre application. L'appartenance
        vient donc de la RÉALITÉ — le profil qui existe déjà —, et ce sont les
        verticales qui la déclarent.


        ⚠️ **Un compte de DIRECTION ne reçoit jamais d'appartenance** : il
        répond `200` avec `agent_app` vide. Lui en poser une le rendrait
        aveugle à l'autre application, alors qu'il l'ouvre pour reproduire ce
        qu'on lui décrit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, app]
              properties:
                user_id: {type: string}
                app: {type: string, enum: [driver, courier]}
                from_profile:
                  type: boolean
                  description: >-
                    La verticale voit-elle DÉJÀ un profil pour ce compte ?
                    N'change rien à ce qui est écrit — journalisée, pour qu'on
                    puisse relire la migration et distinguer une appartenance
                    venue d'un profil existant (un fait) de celle venue d'une
                    application qui a frappé la première.
      responses:
        "200": {description: "`{agent_app}` — l'appartenance EN VIGUEUR après l'appel"}
        "403":
          description: >-
            `wrong_app` — le compte appartient à l'autre application ;
            `error.reason` la nomme. ⚠️ **Rien n'est écrasé** : la première
            réclamation gagne, et aucun profil n'est supprimé nulle part.
        "404": {description: user_not_found}
  /internal/alerts:
    post:
      tags: [internal]
      summary: "Le crochet de la supervision — les alertes arrivent au staff (v4.34.0)"
      security: [{ bearer: [] }]
      description: >-
        Appelé par Alertmanager. ⚠️ **Route interne** : la passerelle refuse
        `/api/v1/internal/` de l'extérieur, et le jeton de service est vérifié.


        ⚠️ **Les alertes arrivent là où les gens regardent déjà.** Un canal de
        plus — un courriel que personne n'ouvre, une interface qu'il faut
        penser à visiter — est un canal qu'on ignore au bout de trois semaines.
        Elles empruntent donc la notification du staff, comme « un chauffeur
        attend sa validation ».


        ⚠️ **Le rétablissement se dit aussi** (`status: resolved`) : une alerte
        qui ne se referme jamais oblige à aller vérifier soi-même que c'est
        fini, après quoi on n'y croit plus, dans un sens comme dans l'autre.


        ⚠️ Le corps vient d'un autre logiciel : tout y est traité comme du
        **texte**, jamais comme une instruction, et **borné** — une description
        d'alerte peut contenir la sortie entière d'une requête. Un lot est
        limité à dix alertes : une panne de base en déclenche trente en trente
        secondes, et deux cents notifications feraient du téléphone de
        l'astreinte un réveil inutilisable.
      responses:
        "202": {description: "Relayé (le nombre de destinataires est rendu)"}

  /admin/faults:
    get:
      tags: [admin]
      summary: "Les pannes de la plateforme — groupées, datées, comptées (v4.34.0)"
      security: [{ bearer: [] }]
      description: >-
        **Les paniques et les refus serveur de TOUS les services**, rangés
        ici. ⚠️ Une pile d'exécution perdue dans un flux de texte n'a jamais
        réparé personne : elle disparaît à la rotation, personne ne la voit
        passer, et la même panique mille fois ressemble à mille problèmes.


        ⚠️ **UNE LIGNE PAR EMPREINTE, pas par occurrence.** L'empreinte est
        calculée sur ce qui NE VARIE PAS — service, nature, route, message
        dont les identifiants sont retirés. « Course 6ab8… introuvable » et
        « course 6ac1… introuvable » sont le **même** défaut ; les séparer
        rendrait la liste illisible au bout d'une heure. `count`,
        `first_seen` et `last_seen` font toute la valeur de la liste : « trois
        fois en un mois » et « trois mille fois depuis ce matin » ne se
        traitent pas de la même façon.


        ⚠️ **Seulement les `5xx` et les paniques.** Un `404` n'est pas une
        panne, un `422` non plus : ce sont des refus attendus, déjà comptés
        par les mesures.


        Rendues **par dernière occurrence** : une panne qui arrive trois mille
        fois par jour depuis six mois est connue ; celle qui vient
        d'apparaître est celle qu'on cherche.


        Filtres : `service`, `kind` (`panic` · `http_5xx`), `state`
        (`open` · `resolved`), `days`, `limit`.
      responses:
        "200": {description: Les pannes}

  /admin/faults/{fingerprint}:
    get:
      tags: [admin]
      summary: "Une panne, avec la pile de sa dernière occurrence (v4.34.0)"
      security: [{ bearer: [] }]
      parameters: [{ name: fingerprint, in: path, required: true, schema: { type: string } }]
      description: >-
        ⚠️ La pile n'est gardée que de la **dernière** occurrence : les garder
        toutes pèserait des mégaoctets pour cent fois la même chose. Le
        contexte qui l'accompagne — `request_id`, `country`, `user_id` — est
        celui de cette occurrence-là, et c'est ce qui permet de la rejouer.
      responses:
        "200": {description: La panne}
        "404": {description: fault_not_found}

  /admin/faults/{fingerprint}/resolve:
    post:
      tags: [admin]
      summary: "Dire qu'une panne est corrigée (v4.34.0)"
      security: [{ bearer: [] }]
      parameters: [{ name: fingerprint, in: path, required: true, schema: { type: string } }]
      description: >-
        ⚠️ **Elle se rouvre toute seule si la panne revient.** Une résolution
        qui tient malgré les faits est un mensonge qu'on relit chaque semaine :
        c'est ainsi qu'une liste de pannes devient un mur d'avertissements
        polis que plus personne ne lit.
      responses:
        "200": {description: resolved}
        "404": {description: fault_not_found}

  /admin/audit:
    get:
      tags: [admin]
      summary: The platform's audit journal — every service, one timeline
      description: >-
        UN SEUL JOURNAL. Chaque service tenait le sien et la console ne lisait
        que celui de la livraison : une suspension de compte (socle), une
        immobilisation de véhicule (courses) n'apparaissaient nulle part. Les
        verticales écrivent désormais ici (`POST /internal/audit`), chaque
        entrée porte `service` ∈ `core` · `vtc` · `food`, et cette route rend
        tout, du plus récent au plus ancien.
      parameters:
        - {name: service, in: query, schema: {type: string, enum: [core, vtc, food]}}
        - {name: actor_id, in: query, schema: {type: string}}
        - {name: action, in: query, schema: {type: string}}
        - {name: resource_id, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: limit, in: query, schema: {type: integer}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        service: {type: string}
                        actor_id: {type: string}
                        actor_role: {type: string}
                        action: {type: string, example: ticket.update}
                        resource_type: {type: string}
                        resource_id: {type: string}
                        before: {type: object}
                        after: {type: object}
                        created_at: {type: string, format: date-time}
                  next_cursor: {type: string}
  /admin/users:
    get:
      tags: [admin]
      summary: Search accounts
      description: >-
        L'annuaire est COMMUN aux deux verticales : la console des repas et
        celle des courses cherchent la même personne. La fiche complète d'un
        livreur — solde, véhicules, courses — se compose dans la verticale, à
        partir de ces lignes.


        Chaque ligne porte **`agent_app`** (v4.37.0) : l'application d'agent à
        laquelle ce compte appartient — `driver` (les courses), `courier` (la
        livraison), ou **absent** tant qu'aucune verticale ne l'a réclamée.
        ⚠️ Montrez-le sur la fiche : le support ne peut pas libérer
        (`DELETE /admin/users/{id}/agent-app`) ce qu'il ne voit pas.
      parameters:
        - {name: role, in: query, schema: {type: string, enum: [client, driver, merchant, admin]}}
        - {name: status, in: query, schema: {type: string, enum: [active, suspended]}}
        - {name: q, in: query, schema: {type: string}, description: Nom ou téléphone}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, maximum: 100}}
      responses:
        "200": {description: Accounts}
    post:
      tags: [admin]
      summary: Open an account from the back-office
      description: >-
        Tout rôle, admin compris. Un `driver` reçoit son portefeuille de
        jetons à l'ouverture. Le téléphone est l'identifiant : un doublon
        rend 409 `phone_taken`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, name, phone, password]
              properties:
                role: {type: string, enum: [client, driver, merchant, admin]}
                name: {type: string}
                phone: {type: string, description: E.164}
                email: {type: string}
                password: {type: string, minLength: 8}
      responses:
        "201": {description: Account}
        "409": {description: phone_taken}
  /admin/users/{id}:
    get:
      tags: [admin]
      summary: One account
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Account}
        "404": {description: user_not_found}
    patch:
      tags: [admin]
      summary: Correct an account's identity
      description: >-
        Les champs absents ne bougent pas. `password` remplace le mot de passe
        sans exiger l'ancien — c'est un geste d'administration, tracé à
        l'audit. Le statut a sa propre route.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                email: {type: string}
                phone: {type: string, description: E.164}
                password: {type: string, minLength: 8}
                avatar_url: {type: string}
      responses:
        "200": {description: Account}
        "404": {description: user_not_found}
    delete:
      tags: [admin]
      summary: "Fermer un compte et programmer l'effacement de son identité (v4.47.0)"
      description: >-
        ⚠️ NE SUPPRIME PLUS LA LIGNE. Elle était détruite jusqu'ici, et c'était
        un défaut : chaque course, commande, écriture de portefeuille et entrée
        de grand livre porte un `user_id`, et les détruire laissait des
        milliers de références vers un compte introuvable.


        Le compte est FERMÉ tout de suite — sessions coupées, notifications
        arrêtées, connexion refusée (403 `account_closed`) — puis son IDENTITÉ
        part à l'échéance du délai de grâce (trente jours,
        `ACCOUNT_ERASURE_GRACE`) : le nom devient « Compte supprimé », le
        téléphone est brouillé et libéré, l'e-mail, la photo, l'état civil et
        le carnet d'adresses s'en vont, et les verticales sont prévenues pour
        purger ce qu'elles seules détiennent.


        Les OPÉRATIONS restent intactes — prix, commission, date — et comme
        aucune verticale ne stocke de nom ni de téléphone, toutes les courses
        et commandes passées deviennent anonymes du même coup.


        Pendant le délai, `PATCH /admin/users/{id}/status` à `active` ANNULE
        l'effacement : c'est le recours de quelqu'un qui a touché le bouton par
        erreur. Après, c'est 409 `account_already_erased`.


        Refus : 409 `cannot_delete_self`, 409 `wallet_not_empty` (solde, jetons
        ou dette — on ne détruit pas de l'argent en silence), 409
        `deletion_already_requested`.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - name: immediate
          in: query
          schema: {type: boolean}
          description: >-
            `true` efface SANS attendre le délai de grâce — demande légale,
            compte frauduleux. Jamais le défaut : une suppression immédiate ne
            se rattrape pas.
      responses:
        "204": {description: Closed, erasure scheduled}
        "404": {description: user_not_found}
        "409": {description: cannot_delete_self, wallet_not_empty, deletion_already_requested}
        "503": {description: erasure_unavailable}
  /admin/users/{id}/status:
    patch:
      tags: [admin]
      summary: Activate or suspend an account
      description: >-
        Rend l'état AVANT la modification, pour que la trace d'audit dise ce
        qui a réellement bougé. ⚠️ Une suspension ne ferme pas les sessions en
        cours : les verticales vérifient le jeton localement, sans appeler le
        socle. Le rafraîchissement est refusé, donc la porte se referme au plus
        tard à l'expiration de l'accès.


        ⚠️ `closed` NE S'ÉCRIT PAS D'ICI (422) : une fermeture n'est pas une
        sanction, c'est une demande de suppression — elle passe par
        `DELETE /admin/users/{id}`. En revanche `active` sur un compte fermé
        ANNULE son effacement programmé : c'est à cela que sert le délai de
        grâce. Un compte déjà effacé, lui, ne se rouvre pas
        (409 `account_already_erased`).
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Previous state and new status}
        "404": {description: user_not_found}
        "422": {description: status must be active or suspended}
  /admin/users/{id}/agent-app:
    delete:
      tags: [admin]
      summary: "LIBÉRER l'appartenance métier d'un compte d'agent (v4.37.0)"
      description: >-
        Un compte d'agent appartient à UNE application — `driver` (les courses)
        ou `courier` (la livraison) — et la connexion à l'autre lui est refusée
        (403 `wrong_app`). **Ce geste rend cette appartenance.**


        ⚠️ **C'EST LA SORTIE DU SUPPORT, ET ELLE EST INDISPENSABLE.** Une
        personne change de métier — livreuse hier, chauffeuse aujourd'hui, la
        moto vendue et la voiture louée. Sans ce geste, le support n'a aucune
        issue : il ouvrira un second compte à la même personne, avec un second
        téléphone, un second portefeuille et un second historique, c'est-à-dire
        exactement le désordre que la règle existe pour éviter.


        ⚠️ **Aucun profil n'est supprimé.** La personne garde son profil de
        livreuse et tout ce qu'il porte ; elle pourra réclamer `driver` en
        ouvrant l'application des courses. Ce qui n'est surtout PAS décidé
        ici : c'est l'application qu'elle ouvre qui le dira.


        **IDEMPOTENT** — libérer ce qui est déjà libre répond `200` avec
        `released_agent_app` vide, sans rien écrire ni tracer. Un geste
        d'administration qui échoue parce qu'il a déjà été fait pousse à
        s'acharner. Le geste est inscrit au **journal d'audit**
        (`user.agent_app.release`) : « qui a laissé ce compte changer de
        métier, et quand ? » sera demandé.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: "`{released_agent_app}` — ce qui vient d'être rendu (vide s'il n'y avait rien)"}
        "404": {description: user_not_found}
components:
  schemas:
    MapMarker:
      type: object
      description: Un marqueur de carte hors véhicule, ses images et ses pins numérotés.
      properties:
        kind: {type: string, enum: [courier, client, merchant]}
        icon_url: {type: string, format: uri, description: "à côté d'un nom, dans une liste"}
        map_icon_url: {type: string, format: uri, description: "le pin PRINCIPAL sur une carte À PLAT — vue de dessus, caméra à 90°"}
        nav_icon_url:
          type: string
          format: uri
          description: >-
            Le même marqueur sur une carte de NAVIGATION, inclinée : vue 3D,
            caméra à ~45°. Servi pour les seuls genres qui BOUGENT —
            aujourd'hui `courier`.


            ⚠️ La distinction n'est pas « véhicule / pas véhicule », c'est
            « couché sur la route / debout sur la carte ». Un livreur est
            dessiné à plat sur la chaussée, et une vue de dessus y paraît
            écrasée dès que la caméra penche. Un client, un marchand, une
            étape sont des pastilles qui se DRESSENT : même image quelle que
            soit l'inclinaison.


            Absent : retombez sur `map_icon_url`.
        dest_icon_url:
          type: string
          format: uri
          description: >-
            Le point d'ARRIVÉE — la fin d'une course. Servi pour les seuls
            genres qui en ont un : aujourd'hui `client`.


            ⚠️ Le client et sa destination ne sont pas le même point. Le pin
            PRINCIPAL marque QUELQU'UN — le passager qui attend au départ, la
            personne à qui on remet une commande ; celui-ci marque un LIEU où
            personne n'attend encore. Les dessiner pareil oblige à lire les
            libellés pour savoir lequel est lequel, ce qu'on n'a pas le temps
            de faire sur une carte.


            Un marchand n'en a pas : une boutique est une ÉTAPE, la
            destination de personne.


            Absent : retombez sur `map_icon_url`.
        numbered:
          type: array
          description: >-
            Les pins NUMÉROTÉS, rangs 1 à 4, toujours servis au complet même
            vides — une liste trouée obligerait à deviner si un rang manque
            parce qu'il n'est pas réglé ou parce qu'il n'existe pas. ABSENT
            pour `courier`, qui n'en porte pas : un champ absent se lit
            « sans objet », une liste vide se lirait « rien de réglé ».


            Le numéro est une affaire de CARTE : dans une liste, le nom
            distingue déjà les points. C'est pourquoi un pin numéroté ne porte
            que `map_icon_url`.
          items:
            type: object
            properties:
              index: {type: integer, minimum: 1, maximum: 4, description: "le rang du PASSAGE — la 1re collecte porte le pin 1"}
              map_icon_url: {type: string, format: uri}
        max_numbered: {type: integer, description: "combien de rangs existent, pour ne pas coder le nombre en dur"}
        updated_at: {type: string, format: date-time}
    EquipmentPlan:
      type: object
      description: >-
        COMMENT l'argent revient. Tout est facultatif et défaut aux réglages du
        pays ; un contrat ne porte que ce qu'il surcharge.
      properties:
        schedule: {type: string, enum: [upfront, installments, per_period, none], description: "comptant à la remise · N échéances · un loyer par période · rien"}
        installments: {type: integer, minimum: 0, maximum: 60}
        period: {type: string, enum: [daily, weekly, biweekly, monthly]}
        first_due_days: {type: integer, minimum: 0, description: "jours entre la remise et la première échéance"}
        collect_from_earnings: {type: boolean, description: "retenir sur chaque gain"}
        collect_from_wallet: {type: boolean, description: "prélever le solde Dira à l'échéance (livreurs) / porter au grand livre à la prochaine course (chauffeurs)"}
        allow_partial: {type: boolean, description: "prendre ce qu'il y a quand le solde ne couvre pas"}
        earnings_percent: {type: integer, minimum: 0, maximum: 100}
        earnings_fixed_xof: {type: integer, minimum: 0}
        min_left_xof: {type: integer, minimum: 0, description: "ce qu'on laisse au moins à l'agent sur un gain"}
        daily_cap_xof: {type: integer, minimum: 0}
        weekly_cap_xof: {type: integer, minimum: 0}
        earnings_only_when_due: {type: boolean, description: "ne retenir que l'échu (sinon la retenue rembourse en avance)"}
        grace_days: {type: integer, minimum: 0}
        late_fee_xof: {type: integer, minimum: 0}
        late_fee_percent: {type: integer, minimum: 0, maximum: 100}
        block_after_days: {type: integer, minimum: 0, description: "0 = jamais bloqué"}
        reminder_days: {type: integer, minimum: 0}
        deposit_refundable: {type: boolean}
    EquipmentItem:
      type: object
      properties:
        id: {type: string}
        country: {type: string}
        kind: {type: string, enum: [vest, bag, phone, helmet, box, other]}
        name: {type: string}
        description: {type: string}
        photos: {type: array, items: {type: string}}
        audiences: {type: array, items: {type: string, enum: [food, vtc]}, description: "vide = les deux"}
        sale_price_xof: {type: integer}
        rental_daily_xof: {type: integer}
        rental_weekly_xof: {type: integer}
        rental_monthly_xof: {type: integer}
        deposit_xof: {type: integer}
        stock: {type: integer}
        track_stock: {type: boolean}
        active: {type: boolean}
        default_plan: {$ref: "#/components/schemas/EquipmentPlan"}
    EquipmentContract:
      type: object
      properties:
        id: {type: string}
        user_id: {type: string}
        user_name: {type: string, description: ADMIN seulement}
        vertical: {type: string, enum: [food, vtc]}
        item_id: {type: string}
        item_name: {type: string}
        item_kind: {type: string}
        quantity: {type: integer}
        serial: {type: string}
        mode: {type: string, enum: [sale, rental, loan]}
        plan: {$ref: "#/components/schemas/EquipmentPlan"}
        status: {type: string, enum: [requested, draft, accepted, active, returned, completed, defaulted, cancelled]}
        price_xof: {type: integer, description: "prix total (vente) ou loyer par période (location)"}
        deposit_xof: {type: integer}
        paid_xof: {type: integer}
        outstanding_xof: {type: integer}
        due_xof: {type: integer}
        overdue_since: {type: string, format: date-time}
        blocked: {type: boolean}
        schedule:
          type: array
          items:
            type: object
            properties:
              n: {type: integer}
              kind: {type: string, enum: [deposit, installment, period, damage]}
              due_at: {type: string, format: date-time}
              amount_xof: {type: integer}
              late_fee_xof: {type: integer}
              paid_xof: {type: integer}
              owed_xof: {type: integer}
              paid_at: {type: string, format: date-time}
              status: {type: string, enum: [pending, due, overdue, paid, waived]}
        payments:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              at: {type: string, format: date-time}
              amount_xof: {type: integer, description: "négatif = rendu à l'agent"}
              source: {type: string, enum: [earnings, wallet, ledger, mobile_money, manual, waiver, refund]}
              ref_kind: {type: string}
              ref_id: {type: string}
              note: {type: string}
              pending: {type: boolean}
        return_condition: {type: string}
        damage_fee_xof: {type: integer}
        next_period_at: {type: string, format: date-time}
        notes: {type: string}
        handed_at: {type: string, format: date-time}
        returned_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
    EquipmentStanding:
      type: object
      properties:
        contracts: {type: integer}
        outstanding_xof: {type: integer}
        due_xof: {type: integer}
        overdue_xof: {type: integer}
        blocked: {type: boolean, description: "le retard passe le seuil : plus de mise en ligne"}
    VerticalBilling:
      type: object
      properties:
        agent_charge: {type: string, enum: [tokens, commission]}
        commission_pct: {type: integer, minimum: 0, maximum: 100}
        tokens_per_ride: {type: integer}
        tokens_per_km: {type: integer}
        tokens_min: {type: integer}
        tokens_max: {type: integer}
        client_charge_at: {type: string, enum: [request, accept, start, complete]}
        debt_limit_xof: {type: integer}
    Billing:
      type: object
      properties:
        country: {type: string}
        rides: {$ref: "#/components/schemas/VerticalBilling"}
        deliveries: {$ref: "#/components/schemas/VerticalBilling"}
        updated_by: {type: string}
        updated_at: {type: string, format: date-time}
    AccountingEntry:
      type: object
      properties:
        id: {type: string}
        country: {type: string}
        at: {type: string, format: date-time}
        service: {type: string, enum: [core, vtc, food]}
        reason: {type: string}
        ref_kind: {type: string}
        ref_id: {type: string}
        transaction_id: {type: string}
        wallet_id: {type: string}
        owner_id: {type: string}
        unit: {type: string, enum: [xof, token]}
        amount: {type: integer, description: en francs — les jetons sont valorisés au prix du jeton}
        tokens: {type: integer}
        description: {type: string}
        lines:
          type: array
          items:
            type: object
            properties:
              account: {type: string}
              debit: {type: integer}
              credit: {type: integer}
    MoneyDeclarationCategory:
      type: object
      required: [code, label, direction, account]
      properties:
        code: {type: string, pattern: "^[a-z0-9_]{2,40}$", description: ce que PORTENT les déclarations — il ne se renomme pas}
        label: {type: string, maxLength: 80}
        direction: {type: string, enum: [in, out, both]}
        account: {type: string, description: un code de `accounts` (le plan comptable, restreint aux comptes déclarables)}
        disabled: {type: boolean}
    MoneyDeclarationCatalog:
      type: object
      properties:
        country: {type: string}
        categories: {type: array, items: {$ref: "#/components/schemas/MoneyDeclarationCategory"}}
        updated_by: {type: string}
        updated_at: {type: string, format: date-time}
        accounts:
          type: array
          description: les SEULS comptes qu'une catégorie peut mouvoir
          items:
            type: object
            properties:
              code: {type: string}
              kind: {type: string, enum: [asset, liability, clearing, revenue, expense]}
              label: {type: string}
        means: {type: array, items: {type: string, enum: [cash, bank, mobile_money]}}
    MoneyDeclarationInput:
      type: object
      required: [direction, category, means, amount, value_date, counterparty, justification]
      properties:
        direction: {type: string, enum: [in, out]}
        category: {type: string, description: un code du catalogue du pays}
        means: {type: string, enum: [cash, bank, mobile_money], description: par OÙ l'argent a passé — la contrepartie de l'écriture}
        amount: {type: integer, minimum: 1, description: ENTIER, dans la plus petite unité de la monnaie du pays}
        currency: {type: string, minLength: 3, maxLength: 3, description: "facultatif ; refusé (422) s'il n'est pas celui du pays"}
        value_date: {type: string, format: date, description: le jour où l'argent a bougé — jamais dans le futur}
        counterparty: {type: string, minLength: 2, maxLength: 160, description: qui a payé, ou qui a été payé}
        reference: {type: string, maxLength: 60, description: le numéro de la pièce — UNIQUE par pays quand il est renseigné}
        justification: {type: string, minLength: 5, maxLength: 600}
        attachment_url: {type: string, description: "`POST /uploads?kind=receipt` (images, 5 Mo)"}
        corrects: {type: string, description: la déclaration CONTRE-PASSÉE que celle-ci remplace}
    MoneyDeclaration:
      type: object
      properties:
        id: {type: string}
        country: {type: string}
        direction: {type: string, enum: [in, out]}
        category: {type: string}
        category_label: {type: string, description: FIGÉ à la déclaration}
        account: {type: string, description: le compte mouvementé, FIGÉ à la déclaration}
        means: {type: string, enum: [cash, bank, mobile_money]}
        amount: {type: integer}
        currency: {type: string}
        value_date: {type: string, format: date-time}
        counterparty: {type: string}
        reference: {type: string}
        justification: {type: string}
        attachment_url: {type: string}
        status: {type: string, enum: [posted, reversed]}
        entry_id: {type: string, description: l'écriture du journal}
        reversal_entry_id: {type: string}
        reversal_reason: {type: string}
        reversed_by: {type: string}
        reversed_at: {type: string, format: date-time}
        corrects: {type: string}
        corrected_by: {type: string}
        source: {type: string, description: "`console`, ou le module qui a déclaré"}
        source_ref: {type: string}
        declared_by: {type: string}
        created_at: {type: string, format: date-time}
    MoneyDeclarationSummary:
      type: object
      properties:
        country: {type: string}
        currency: {type: string}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        in: {type: integer}
        out: {type: integer}
        net: {type: integer, description: "`in` − `out`"}
        count: {type: integer, description: les déclarations qui TIENNENT sur la période}
        reversals: {type: integer, description: les contre-passations posées dans la période}
        truncated: {type: boolean, description: le plafond de lecture a été atteint — les totaux sont incomplets}
        categories:
          type: array
          items:
            type: object
            properties:
              category: {type: string}
              label: {type: string}
              account: {type: string}
              in: {type: integer}
              out: {type: integer}
              net: {type: integer}
              count: {type: integer}
        months:
          type: array
          items:
            type: object
            properties:
              month: {type: string, example: "2026-10"}
              in: {type: integer}
              out: {type: integer}
              net: {type: integer}
    EquipmentSettings:
      type: object
      properties:
        country: {type: string}
        allowed_modes: {type: array, items: {type: string}}
        agent_can_request: {type: boolean}
        require_acceptance: {type: boolean}
        max_earnings_percent: {type: integer}
        default_deposit_percent: {type: integer}
        staff_alert_overdue: {type: boolean}
        defaults: {$ref: "#/components/schemas/EquipmentPlan"}
        kinds: {type: array, items: {type: string}}
        modes: {type: array, items: {type: string}}
        periods: {type: array, items: {type: string}}
        schedules: {type: array, items: {type: string}}
    CountryDisclosure:
      type: object
      description: >-
        Ce qu'un public a le droit de voir d'une personne. Tous les champs sont
        posés — un pays jamais réglé rend les défauts de son métier.
      required: [name, first_name, last_name, photo, gender, rating, phone, direct_call, in_app_alert]
      properties:
        name: {type: string, enum: [full, first, initials, hidden]}
        first_name: {type: boolean}
        last_name: {type: boolean}
        photo: {type: boolean}
        gender: {type: boolean}
        rating: {type: boolean}
        phone: {type: boolean, description: Le numéro est AFFICHÉ}
        direct_call: {type: boolean, description: Un BOUTON D'APPEL est proposé}
        in_app_alert: {type: boolean, description: On peut faire SONNER l'application de l'autre}
    CountryExchange:
      type: object
      description: Les deux sens d'un métier. `audience` nomme QUI REGARDE.
      required: [to_client, to_agent]
      properties:
        to_client:
          allOf:
            - $ref: "#/components/schemas/CountryDisclosure"
            - description: Ce qu'un CLIENT voit de l'agent qui le sert.
        to_agent:
          allOf:
            - $ref: "#/components/schemas/CountryDisclosure"
            - description: Ce qu'un AGENT — chauffeur, livreur — voit de son client.
    CountryPrivacy:
      type: object
      required: [vtc, food]
      properties:
        vtc: {$ref: "#/components/schemas/CountryExchange"}
        food: {$ref: "#/components/schemas/CountryExchange"}
    Country:
      type: object
      properties:
        code: {type: string, example: TG}
        name: {type: string, example: Togo}
        currency: {type: string, example: XOF, description: ISO 4217 — la monnaie EN VIGUEUR (réglage ou catalogue)}
        currency_name: {type: string, example: Franc CFA (UEMOA)}
        currency_symbol: {type: string, example: F CFA, description: à écrire après le montant}
        currency_decimals: {type: integer, example: 0, description: 0 = l'entier stocké est l'unité ; 2 = l'entier est en centièmes}
        phone_prefix: {type: string, example: "+228"}
        locale: {type: string, example: fr}
        timezone: {type: string, example: Africa/Lome}
        center:
          type: array
          items: {type: number}
          description: "[lng, lat] de la capitale économique"
        enabled: {type: boolean}
        default: {type: boolean}
    CountryResolution:
      type: object
      properties:
        country:
          type: string
          description: Le pays RETENU — à envoyer dans X-Dira-Country et à considérer comme celui du compte.
        source: {type: string, enum: [geo, ip, account, default]}
        detected:
          type: string
          description: Où la position ou l'adresse IP situe la personne, même hors zone.
        supported: {type: boolean, description: "`detected` est un pays ouvert"}
        updated: {type: boolean, description: le pays du compte a changé}
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
security:
  - bearerAuth: []
