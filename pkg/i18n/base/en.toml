# The refusals the platform pronounces on everyone's behalf — translated ONCE.
# See fr.toml for why this file exists; French is the primary language.

[errors.missing_token]
other = "Authentication required"

[errors.invalid_token]
other = "Invalid or expired token"

[errors.session_superseded]
other = "You have been signed out: your account was just opened on another device."

[errors.forbidden]
other = "You are not allowed to perform this action"

[errors.out_of_scope]
other = "Your staff scope does not cover this part of the platform"

[errors.not_found]
other = "Resource not found"

[errors.invalid_service_token]
other = "Invalid service token"

[errors.service_auth_disabled]
other = "Service-to-service routes are closed: no service token configured"

[errors.ride_not_found]
other = "Ride not found"

[errors.driver_not_found]
other = "Driver not found"

[errors.vehicle_not_found]
other = "Vehicle not found"

[errors.document_not_found]
other = "Document not found"

[errors.ticket_not_found]
other = "Ticket not found"

[errors.duplicate_ticket_reference]
other = "Ticket reference already exists"

[errors.conversation_closed]
other = "This conversation is closed"

[errors.no_driver_yet]
other = "Nobody has taken this yet"

[errors.not_a_lost_item]
other = "This ticket is not about a lost item"

# The door the core uses to announce an erased account (pkg/erasure).
# ⚠️ This refusal never reaches a phone: it answers the core, which re-queues
# the announcement. The sentence exists for the console and the logs.
[errors.erasure_unavailable]
other = "Purging an erased account is not wired on this service"

# A vehicle paper submitted by its OWNER (pkg/compliance).
[errors.vehicle_not_in_your_fleet]
other = "This vehicle does not belong to your fleet"

# The three refusals of a document upload. The last two say what to do — add the
# vehicle, or remove it — which is precisely the phrase a shared code loses.
[errors.unknown_document_kind]
other = "This document type does not exist"

[errors.document_needs_vehicle]
other = "This document belongs to a vehicle: say which one"

[errors.document_refuses_vehicle]
other = "This document belongs to the person, not to a vehicle: remove the vehicle"

# Chat moderation — SHARED package (`pkg/chat`), so these belong to the base
# pack: both verticals serve this refusal.
#
# The phrase says it is a refusal, and never names the word: naming it only
# teaches people to spell it differently.
[errors.message_blocked]
other = "This message was not sent: it contains a threat or an insult that we do not relay"

[errors.cannot_report_own_message]
other = "You can only report a message you received"

[errors.message_not_found]
other = "This message does not exist"
