# LES REFUS QUE LE SOCLE PRONONCE AU NOM DE TOUS — traduits UNE fois, ici.
#
# ⚠️ CE FICHIER EXISTE PARCE QU'UN CHAUFFEUR TOGOLAIS A LU DE L'ANGLAIS. Le refus
# `session_superseded` naît dans `pkg/middleware`, partagé par les trois
# services ; sa traduction ne vivait que dans `locales/fr.toml` du socle. Les
# courses et la livraison, qui lèvent le même refus, servaient donc le texte
# anglais par défaut — « this device is no longer the one signed in to this
# account » — à quelqu'un dont l'application est en français. Relevé par
# l'équipe mobile le 29 septembre 2026.
#
# ⚠️ ET CE N'ÉTAIT PAS UN OUBLI ISOLÉ : dix des seize refus levés par `pkg/*`
# n'avaient de traduction NULLE PART, même dans le socle. Recopier à la main
# dans chaque service est précisément ce qui produit ces trous. Le paquet qui
# lève un refus porte sa phrase ; chaque service charge ce fichier AVANT le sien
# et peut le surcharger, jamais l'oublier.

[errors.missing_token]
other = "Authentification requise"

[errors.invalid_token]
other = "Jeton invalide ou expiré"

[errors.session_superseded]
other = "Vous avez été déconnecté : votre compte vient d'être ouvert sur un autre appareil."

[errors.forbidden]
other = "Vous n'êtes pas autorisé à effectuer cette action"

[errors.out_of_scope]
other = "Votre périmètre ne couvre pas cette partie de la plateforme"

[errors.not_found]
other = "Ressource introuvable"

[errors.invalid_service_token]
other = "Jeton de service invalide"

[errors.service_auth_disabled]
other = "Les échanges entre services sont fermés : aucun jeton de service n'est configuré"

[errors.ride_not_found]
other = "Course introuvable"

[errors.driver_not_found]
other = "Chauffeur introuvable"

[errors.vehicle_not_found]
other = "Véhicule introuvable"

[errors.document_not_found]
other = "Document introuvable"

[errors.ticket_not_found]
other = "Ticket introuvable"

[errors.duplicate_ticket_reference]
other = "La référence du ticket existe déjà"

[errors.conversation_closed]
other = "Cette conversation est close"

[errors.no_driver_yet]
other = "Personne n'a encore pris en charge cette demande"

[errors.not_a_lost_item]
other = "Ce ticket ne concerne pas un objet perdu"

# La porte par laquelle le socle annonce un compte effacé (pkg/erasure).
# ⚠️ Ce refus ne part JAMAIS vers un téléphone : il répond au socle, qui remet
# l'annonce en file. La phrase existe pour la console et les journaux.
[errors.erasure_unavailable]
other = "La purge d'un compte effacé n'est pas branchée sur ce service"

# Le dépôt d'un papier par le PROPRIÉTAIRE d'un véhicule (pkg/compliance).
# ⚠️ Le pendant exact de `vehicle_not_found` pour l'autre déposant : déposer
# l'assurance d'une voiture qui n'est pas la sienne la rendrait conforme sans
# que son propriétaire le sache.
[errors.vehicle_not_in_your_fleet]
other = "Ce véhicule n'appartient pas à votre flotte"

# LES TROIS REFUS D'UN DÉPÔT DE PIÈCE.
#
# ⚠️ `unknown_document_kind` EST DEVENU ATTEIGNABLE le jour où le DTO a cessé de
# doubler la liste des types : il portait `validation_failed`, donc « Requête
# invalide ». Les deux autres DISENT QUOI FAIRE — ajouter le véhicule, ou le
# retirer — et c'est exactement la phrase qu'un code partagé fait perdre.
[errors.unknown_document_kind]
other = "Ce type de pièce n'existe pas"

[errors.document_needs_vehicle]
other = "Cette pièce est celle d'un véhicule : dites lequel"

[errors.document_refuses_vehicle]
other = "Cette pièce est celle de la personne, pas d'un véhicule : retirez le véhicule"

# LA MODÉRATION DU CHAT — paquet PARTAGÉ (`pkg/chat`), donc phrases de BASE :
# les deux verticales servent ce refus, et une phrase écrite dans les locales
# du socle n'aurait jamais atteint la livraison ni les courses.
#
# ⚠️⚠️ LA PHRASE DIT QUE C'EST UN REFUS, et elle ne nomme PAS le mot. Un
# message bloqué en silence fait croire à une panne du réseau : on le renvoie
# trois fois, puis on appelle le support. Et nommer le mot interdit
# n'apprendrait qu'une chose — à l'écrire autrement.
[errors.message_blocked]
other = "Ce message n'a pas été envoyé : il contient une menace ou une insulte que nous ne relayons pas"

# ⚠️ ON NE SIGNALE QUE CE QU'ON A REÇU : se signaler soi-même remplirait la
# file de bruit, ou servirait à faire croire qu'on a été agressé.
[errors.cannot_report_own_message]
other = "Vous ne pouvez signaler qu'un message que vous avez reçu"

[errors.message_not_found]
other = "Ce message n'existe pas"

# ⚠️⚠️ LA PHRASE D'UNE FONCTION RETIRÉE EST DANS LA BASE, parce que TROIS
# services la lèvent : le socle, les courses, la livraison. Rangée dans le
# fichier d'un seul, les deux autres l'auraient servie en anglais — et Dira
# Lite la LIT À VOIX HAUTE à quelqu'un qui ne lit pas. Un refus prononcé dans
# une langue qu'on ne parle pas est un silence.
#
# ⚠️ ET ELLE NE PARLE NI D'ÉDITION NI DE PAYS : la personne n'a qu'une
# application, elle ne sait pas qu'il en existe deux, et elle ne peut rien
# faire de cette information. Courte, pour qu'une synthèse vocale la finisse
# avant de perdre son auditeur.
[errors.feature_unavailable_in_edition]
other = "Cette fonction n'est pas disponible dans votre application"

# ⚠️ Dira Lite LIT CE REFUS À VOIX HAUTE à quelqu'un qui ne lit pas : une
# phrase non traduite serait PRONONCÉE en anglais. Et le micro ne devrait pas
# être affiché là où il ne marche pas (`voice.enabled`) — ce refus est le
# filet, pas la règle.

[errors.voice_messages_unavailable]
other = "Les messages vocaux ne sont pas disponibles ici"

[errors.voice_too_long]
other = "Ce message vocal est trop long"
