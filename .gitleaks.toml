# CE QU'ON AUTORISE À RESSEMBLER À UN SECRET SANS EN ÊTRE UN.
#
# ⚠️ ON GARDE TOUTES LES RÈGLES PAR DÉFAUT. Une autorisation se donne à un
# endroit précis, jamais en éteignant la détection : le jour où quelqu'un colle
# une vraie clé, c'est cette détection-là qui doit crier.
[extend]
useDefault = true

# ⚠️ UNE SEULE FORME D'AUTORISATION DANS CE FICHIER : `[[allowlists]]`, la forme
# TABLEAU. gitleaks accepte aussi `[allowlist]` au singulier, et faire cohabiter
# les deux dans un même fichier est le genre de détail qui fait perdre une règle
# SANS RIEN DIRE — on croit avoir deux autorisations, on en a une.

[[allowlists]]
description = """
Les collections `.rest/` sont des BLOCS-NOTES DE REQUÊTES : elles montrent la
forme d'un corps d'appel, avec des valeurs d'exemple. Le résultat qui a déclenché
cette autorisation est `"password": "nouveau-mdp-123"` dans
`.rest/40-admin.rest` — la démonstration du champ `password` d'un
`PATCH /admin/users/{id}`, pas un identifiant vers quoi que ce soit.

⚠️ LES VRAIES VALEURS N'Y SONT PAS, et c'est ce qui rend cette autorisation
acceptable : elles vivent dans `.rest/.env`, ignoré par git depuis le début
(`.gitignore`, ligne 4). Seul `.rest/.env.example` est versionné, et il ne porte
que des noms de variables.

⚠️ LE RISQUE QUI RESTE, DIT FRANCHEMENT : un jeton réel collé dans un `.rest`
pendant une séance de débogage ne serait plus signalé. Si cela devait arriver,
c'est ici qu'il faudra resserrer — en n'autorisant que la règle
`generic-api-key` sur ce dossier, et non toutes. On ne l'a pas fait tout de suite
parce que la forme par règle de gitleaks demande de redéclarer les règles
entières, ce qui fait perdre les mises à jour de la liste par défaut — un remède
plus coûteux que le mal.
"""
paths = ['''^\.rest/''']

# ⚠️ UN EXEMPLE DE DOCUMENTATION, DANS L'HISTORIQUE — qu'aucune modification du
# fichier ne peut retirer.
#
# `docs/frontend/VTC-CLIENT.md` (4.68.0, commit 7670d44) montrait la réponse de
# création d'un lien de suivi avec un jeton d'allure RÉELLE, repris dans l'`url`
# juste en dessous. Le scan lit l'HISTORIQUE (`fetch-depth: 0`) : remplacer la
# valeur dans le fichier — c'est fait, elle dit maintenant
# `<JETON-EN-CLAIR-UNE-SEULE-FOIS>` — ne la retire pas du dépôt, et ce résultat
# faisait donc échouer la porte sur CHAQUE pull request, pour tout le monde.
#
# ⚠️ AUTORISÉ PAR COMMIT, ET PAS PAR CHEMIN. `^docs/frontend/` aurait été plus
# simple et bien pire : les specs sont précisément l'endroit où quelqu'un colle
# un vrai jeton en documentant une route. Un seul commit nommé laisse la
# détection crier partout ailleurs, y compris dans ces mêmes fichiers demain.
#
# ⚠️ ET SI CE JETON AVAIT ÉTÉ RÉEL : le lien de suivi porte un jeton HACHÉ côté
# serveur et son `expires_at` était le 12 octobre 2026 — il est mort de toute
# façon. C'est la seule raison pour laquelle on autorise au lieu de révoquer.
[[allowlists]]
description = "Jeton d'EXEMPLE d'un lien de suivi, dans les specs frontend (4.68.0)"
commits = ['''7670d44a730fba012b9881fc7ba831d737165560''']
