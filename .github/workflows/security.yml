# CE QUE LE CODE EMBARQUE SANS QU'ON L'AIT CHOISI.
#
# ⚠️ `govulncheck` NE COMPARE PAS DES NUMÉROS DE VERSION : il regarde si le code
# APPELLE réellement la fonction vulnérable. C'est ce qui le rend utilisable —
# un scanner de versions signale trente alertes dont vingt-huit ne concernent pas
# le service, et au bout de deux semaines plus personne ne les lit.
#
# ⚠️ IL BLOQUE LA FUSION, ET C'EST ASSUMÉ. Le jour où une faille est publiée dans
# une dépendance qu'on appelle vraiment, toutes les PR rougissent — c'est
# désagréable, mais le remède est un `go get`, pas une dérogation. Une
# vérification qui n'arrête rien n'arrête rien.
#
# ⚠️ ET IL TOURNE AUSSI LE LUNDI, SANS PR. Une faille n'attend pas qu'on modifie
# le code : sans ce réveil hebdomadaire, un dépôt calme pendant deux mois reste
# vulnérable deux mois sans que rien ne le dise. C'est exactement ce qui est
# arrivé au service de suivi, resté trois versions mineures en arrière jusqu'à ce
# qu'on pense à mesurer `go_info`.
name: Sécurité

# ⚠️ LE `push` VERS `main` PART (18 octobre 2026) : il rejouait sur `main` le
# verdict que la PR venait de rendre. La PR, elle, RESTE — ce dépôt est PUBLIC,
# ses minutes sont gratuites, et un secret commis dans un dépôt public est le
# pire des cas : c'est le seul endroit de la plateforme où cette barrière garde
# tout son prix sans rien coûter.
on:
  pull_request:
  schedule:
    # Lundi, 6 h UTC — avant que la semaine commence.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Une exécution par référence : la suivante annule la précédente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vulnerabilites:
    name: Vulnérabilités atteignables
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: ./go.sum
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  secrets:
    name: Secrets dans l'historique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ⚠️ TOUT L'HISTORIQUE, PAS SEULEMENT LA POINTE. Un secret retiré au
          # commit suivant reste dans l'historique pour toujours, et c'est là
          # qu'on le cherche : le retirer du fichier ne le retire pas du dépôt.
          fetch-depth: 0
      # ⚠️ L'IMAGE, PAS L'ACTION OFFICIELLE : `gitleaks-action` exige une licence
      # payante pour les dépôts d'ORGANISATION, et aurait échoué à chaque
      # exécution sans que l'échec dise pourquoi. L'outil, lui, est libre.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --no-banner --redact --verbose

  image:
    name: Ce que l'image expédie
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ⚠️ TRIVY VOIT CE QUE `govulncheck` NE PEUT PAS VOIR, et la différence est
      # le propos. `govulncheck` ne signale que ce que le code APPELLE — c'est ce
      # qui le rend utilisable. Trivy signale ce que l'image EXPÉDIE, appelé ou
      # non : les paquets du système de base, et les dépendances transitives
      # qu'on embarque sans jamais s'en servir.
      #
      # Exemple réel, trouvé le 28 septembre 2026 : `golang.org/x/crypto v0.54.0`
      # (CVE-2026-56854, contournement d'authentification SSH). `govulncheck` se
      # taisait à raison — nous n'appelons pas `crypto/ssh`. Mais il est dans le
      # binaire, et « injoignable aujourd'hui » devient « joignable » le jour où
      # quelqu'un ajoute un import.
      #
      # ⚠️ IL NE BLOQUE PAS, ET C'EST LA DIFFÉRENCE DE TRAITEMENT QUI COMPTE. Ce
      # qu'on appelle se corrige tout de suite (`govulncheck` arrête la fusion) ;
      # ce qu'on embarque se corrige au rythme des montées de version. Faire
      # rougir toutes les PR pour une faille qu'aucun chemin n'atteint, c'est
      # obtenir qu'on cesse de lire les deux.
      - name: trivy (système de fichiers)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:latest fs \
            --quiet --scanners vuln,misconfig --severity HIGH,CRITICAL \
            --exit-code 0 /repo
