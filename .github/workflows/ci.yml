name: CI

# ⚠️ PLUS SUR `push` VERS `main` — décidé le 18 octobre 2026.
#
# Après une fusion, la poussée sur `main` rejouait à l'identique ce qui venait
# de passer sur la PR : même arbre, même verdict. Sur 30 jours, la plateforme
# comptait 884 exécutions déclenchées par `push` pour 604 par PR.
#
# ⚠️ MAIS LA PR GARDE SON ÉPREUVE ICI, ET POUR UNE RAISON PRÉCISE : ce dépôt est
# PUBLIC, ses minutes d'exécution sont gratuites. Ailleurs sur la plateforme les
# épreuves ont été ramenées en local parce qu'elles coûtaient ; là où elles ne
# coûtent rien, les retirer ne ferait que perdre une vérification.
on:
  pull_request:
  workflow_dispatch:

# Une exécution par référence : la suivante annule la précédente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # ⚠️ LE CORRECTIF SE DEMANDE AU NUMÉRO EXACT. « 1.26 » laisse le
          # résolveur choisir, et il a servi go1.26.9 le 24 octobre 2026 —
          # six heures après la publication de go1.26.10, qui corrige
          # GO-2026-6809 (crypto/x509, certificats intermédiaires
          # compromis). Une relance n'y a rien changé. Tant que la CVE court,
          # c'est la version qui la corrige qu'on nomme, pas la famille.
          go-version: "1.26.10"

      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
