# --- DELETING AN ACCOUNT (see internal/user/erasure.go) ---
# ⚠️ These sentences face someone who has just tapped "delete my account", so
# they always name the next step: empty the wallet, write to support, sign up
# again. "Operation failed" would leave someone exercising a right with no way
# forward.

[errors.account_closed]
other = "This account has been deleted. You can sign up again with the same number, or write to support if this was a mistake."

[errors.deletion_already_requested]
other = "This account is already scheduled for deletion. Write to support to cancel it."

[errors.wallet_not_empty]
other = "This account still holds money, tokens or a debt. Empty your balance, or ask support for a refund, before deleting."

[errors.erasure_not_self_serve]
other = "This kind of account is deleted by support, not from the app: it carries payouts and sometimes a debt that must be settled first."

[errors.account_already_erased]
other = "This account's data is already erased: it can no longer be restored."

[errors.erasure_unavailable]
other = "Account deletion is not available on this deployment. Please tell the technical team."

# --- PROMO CODES (see internal/promocode) ---
# ⚠️ "INVALID CODE" IS THE WORST MESSAGE. Someone typing a code they read on a
# poster wants to know WHICH reason applies: a mistyped character, a finished
# campaign, a code already used, or one that does not cover what they ordered.
# A single refusal for all of that sends everyone to support, who will know no
# more than they do.

[errors.promo_code_unknown]
other = "This code does not exist. Check the characters — our codes contain no O and no I."

[errors.promo_code_expired]
other = "This code is no longer valid: the campaign has ended."

[errors.promo_code_wrong_country]
other = "This code cannot be used in this country."

[errors.promo_code_wrong_service]
