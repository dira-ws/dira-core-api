# ⚠️⚠️ CHANGER SON MOT DE PASSE. Les comptes à mot de passe de cette plateforme
# sont créés PAR QUELQU'UN D'AUTRE, qui le choisit et le transmet de vive voix.
# Sans ce geste, celui qui a ouvert l'accès le connaît pour toujours — et la
# personne qui s'en sert n'a aucun moyen de reprendre la main sur son compte.
[errors.current_password_wrong]
other = "Le mot de passe actuel n'est pas le bon : vérifiez-le, ou demandez à la personne qui vous a ouvert l'accès"

[errors.password_unchanged]
other = "Le nouveau mot de passe est le même que l'ancien : choisissez-en un autre"

# ⚠️ Un client entre par CODE : lui parler de mot de passe l'enverrait en
# chercher un qu'il n'a jamais eu.
[errors.account_has_no_password]
other = "Ce compte se connecte par code, pas par mot de passe"

# ⚠️ LA PHRASE PORTE LE NOMBRE. C'est le seul endroit de la plateforme où
# quelqu'un INVENTE un mot de passe ; « trop court » l'enverrait essayer au
# hasard. (Et cette règle ne vit PAS dans un tag `validate:` : elle en sortirait
# en « Requête invalide ».)
[errors.password_too_short]
other = "Un mot de passe fait au moins 8 caractères : choisissez-en un plus long"

[errors.password_too_long]
other = "Un mot de passe ne peut pas dépasser 120 caractères"
# LES SEUILS DE DÉTECTION DU BOUTON D'ALERTE — à partir de QUAND ça déclenche.
#
# ⚠️ LA PHRASE PORTE LES BORNES (`reason`), parce qu'une borne qu'on ne dit pas
# se devine au hasard — sur un réglage qui décide si une alerte part.
[errors.sos_threshold_out_of_range]
other = "Ce seuil de détection est hors des bornes admises"

# ⚠️⚠️ LA RÈGLE QUI ÉTEINT UNE DÉTECTION SANS LE DIRE. Une fenêtre plus courte
# que la durée forte qu'elle doit contenir ne peut JAMAIS se remplir : la
# détection est éteinte, et rien ne le signale. Son refus est à part parce que
# sa cause n'est pas dans le champ qu'on vient de taper — on règle la durée, et
# c'est la FENÊTRE qui devient impossible.
[errors.sos_noise_window_too_short]
other = "La fenêtre du bruit ne peut pas être plus courte que la durée forte qu'elle doit contenir : élargissez la fenêtre, ou raccourcissez la durée"

[errors.sos_unknown_app]
other = "Les seuils de détection se règlent par application : utilisez client, driver ou courier"

